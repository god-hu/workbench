<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#f5f3ef">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>每日工作台</title>
<style>
:root{
  --bg:#f5f3ef; --panel:#faf9f6; --card:#ffffff; --border:#ebe7e0;
  --ink:#2e2b27; --sub:#8d877d; --line:#efece6;
  --accent:#5f6b7a; --accent-soft:#eef1f4;
  --done-bg:#e9f0ea; --done-ink:#5a7d63;
  --doing-bg:#f4ece0; --doing-ink:#b08342;
  --shadow:0 1px 3px rgba(40,36,30,.06),0 6px 18px rgba(40,36,30,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,243,239,.94);backdrop-filter:blur(8px);
  padding:11px 14px 9px;border-bottom:1px solid var(--border)}
.topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px}
.search input{width:100%;border:1px solid var(--border);background:var(--card);border-radius:10px;
  padding:9px 12px;font-size:14px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.main{max-width:480px;margin:0 auto;padding:12px 12px 78px}
.wsbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 11px;scrollbar-width:none}
.wsbar::-webkit-scrollbar{display:none}
.wschip{flex:0 0 auto;padding:6px 13px;border-radius:999px;background:var(--card);border:1px solid var(--border);
  font-size:13px;color:var(--sub);white-space:nowrap;cursor:pointer}
.wschip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ov-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;box-shadow:var(--shadow)}
.ov-num{font-size:26px;font-weight:760;color:var(--accent);line-height:1}
.ov-lbl{font-size:12px;color:var(--sub);margin-top:4px}
.ov-ws{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow)}
.ov-ws .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.ov-ws .row:last-child{border:0}
.ov-ws .row .n{color:var(--sub)}
.day{margin-bottom:16px}
.day-head{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding-bottom:7px;border-bottom:1px dashed var(--line);cursor:pointer}
.day-head .chev{color:var(--sub);font-size:12px;transition:transform .15s}
.day-head .date{font-size:15px;font-weight:700}
.day-head .wcount{font-size:12.5px;color:var(--sub)}
.day.collapsed .cards{display:none}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
.row1{display:flex;align-items:center;gap:8px}
.ws{width:26px;height:26px;flex:0 0 26px;border-radius:8px;color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.title{font-size:14.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;flex:0 0 auto}
.pill.done{background:var(--done-bg);color:var(--done-ink)}
.pill.doing{background:var(--doing-bg);color:var(--doing-ink)}
.sum{font-size:13px;color:var(--sub);margin:8px 0 0;line-height:1.5}
.ftime{font-size:11.5px;color:#a9a299;margin-top:8px}
.file-toggle{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;
  border-top:1px solid var(--line);font-size:13px;color:var(--accent);cursor:pointer}
.files{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.files.collapsed{display:none}
.file{display:flex;align-items:center;gap:7px;padding:7px 9px;background:var(--bg);border-radius:9px;font-size:13px}
.file .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.file .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fcat{font-size:11px;color:var(--sub);flex:0 0 auto}
.file .fkind{font-size:10.5px;color:#b3ada3;flex:0 0 auto}
.lib-sec{margin-bottom:18px}
.lib-sec h3{font-size:14px;margin:0 0 9px;display:flex;align-items:center;gap:7px}
.lib-sec h3 .tag{width:10px;height:10px;border-radius:50%}
.lib-sec h3 .c{font-size:12px;color:var(--sub);font-weight:400}
.lib-grid{display:flex;flex-direction:column;gap:8px}
.lib-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.lib-card .fn{font-size:14px;font-weight:600;word-break:break-all}
.lib-card .meta2{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:6px;align-items:center}
.lib-card .path{font-size:11px;color:#b3ada3;margin-top:6px;word-break:break-all}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.idea-add{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.idea-add textarea{flex:1;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;resize:vertical;min-height:48px;line-height:1.5}
.idea-add textarea:focus{border-color:var(--accent)}
.idea-add button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 18px;font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit}
.idea-add button:disabled{opacity:.55}
.idea-del{font-size:11px;color:#b3ada3;cursor:pointer;margin-left:8px}
.idea-del:hover{color:#c06b6b}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:flex;background:rgba(250,249,246,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--border)}
.topbar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.menu-btn{flex:0 0 auto;width:38px;height:38px;margin:-2px 0;border:0;background:transparent;color:var(--ink);font-size:21px;line-height:1;cursor:pointer;border-radius:9px;display:flex;align-items:center;justify-content:center}
.menu-btn:active{background:var(--accent-soft)}
.drawer-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.drawer-mask.show{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:80%;max-width:300px;background:var(--panel);z-index:41;
  transform:translateX(-100%);transition:transform .22s ease;overflow-y:auto;padding:20px 16px;box-shadow:2px 0 18px rgba(0,0,0,.12)}
.drawer.show{transform:translateX(0)}
.drawer h2{font-size:13px;color:var(--sub);margin:6px 0 14px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.dnav{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:11px;font-size:15.5px;color:var(--ink);cursor:pointer;margin-bottom:4px}
.dnav .ic{font-size:18px;width:22px;text-align:center}
.dnav.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dnav:active{background:var(--border)}
.drawer-sep{height:1px;background:var(--border);margin:12px 4px}
.tab{flex:1;text-align:center;padding:8px 0 11px;font-size:12px;color:var(--sub);cursor:pointer}
.tab .ic{font-size:17px;display:block;margin-bottom:2px;line-height:1}
.tab.active{color:var(--accent);font-weight:600}
.lock{position:fixed;inset:0;background:rgba(245,243,240,.96);display:flex;align-items:center;justify-content:center;z-index:9999}
.lock-box{background:#fff;padding:30px 26px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.10);width:300px;max-width:86vw;text-align:center}
.lock-title{font-size:18px;font-weight:600;color:#3a3a3a;margin-bottom:4px}
.lock-sub{font-size:13px;color:#9aa3ad;margin-bottom:16px}
.lock input{width:100%;padding:10px 12px;border:1px solid #e2ddd6;border-radius:10px;font-size:15px;margin-bottom:12px;box-sizing:border-box}
.lock button{width:100%;padding:10px;border:none;border-radius:10px;background:#7d8aa0;color:#fff;font-size:15px;cursor:pointer}
.lock-err{color:#c46;font-size:12px;margin-top:8px;min-height:14px}
</style>
</head>
<body>
<div id="lock" class="lock"><div class="lock-box"><div class="lock-title">每日工作台</div><div class="lock-sub">输入密码查看</div><input id="pwd" type="password" placeholder="密码" /><button onclick="unlock()">解锁</button><div id="lockErr" class="lock-err"></div></div></div>
<div class="topbar">
  <div class="topbar-row">
    <button class="menu-btn" onclick="openDrawer()" aria-label="菜单">&#9776;</button>
    <h1>每日工作台</h1>
  </div>
  <div class="search"><input id="q" placeholder="搜索会话标题、内容、文件名…" oninput="onSearch(this.value)"></div>
</div>
<div class="main" id="main"></div>
<div class="tabbar">
  <div class="tab" id="tab-timeline" onclick="goTab('timeline')"><span class="ic">&#9776;</span>时间线</div>
  <div class="tab" id="tab-material" onclick="goTab('material')"><span class="ic">&#9638;</span>素材库</div>
  <div class="tab" id="tab-ideas" onclick="goTab('ideas')"><span class="ic">&#10022;</span>灵感</div>
  <div class="tab" id="tab-overview" onclick="goTab('overview')"><span class="ic">&#9673;</span>概览</div>
</div>
<div class="drawer-mask" id="mask" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <h2>菜单</h2>
  <div class="dnav" id="dnav-timeline" onclick="goTab('timeline');closeDrawer()"><span class="ic">&#9776;</span>时间线</div>
  <div class="dnav" id="dnav-material" onclick="goTab('material');closeDrawer()"><span class="ic">&#9638;</span>素材库</div>
  <div class="dnav" id="dnav-ideas" onclick="goTab('ideas');closeDrawer()"><span class="ic">&#10022;</span>灵感</div>
  <div class="dnav" id="dnav-overview" onclick="goTab('overview');closeDrawer()"><span class="ic">&#9673;</span>概览</div>
  <div class="drawer-sep"></div>
  <div class="dnav" onclick="closeDrawer()"><span class="ic">&#10005;</span>关闭</div>
</aside>

async function deriveKey(pwd,saltB64){

  if(!pwd)return;
  try{
    const json=await aesDecrypt(ENC_DATA,ENC_SALT,pwd);
    D=JSON.parse(json);
    IDEAS=D.flatMap(s=>s.ideas||[]);
    GH_TOKEN=await aesDecrypt(ENC_TOKEN,ENC_SALT,pwd);
    PWD=pwd;
    document.getElementById("lock").style.display="none";
    await loadIdeas();
    render();
  }catch(e){document.getElementById("lockErr").textContent="密码错误，请重试";}
}
window.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.getElementById("lock").style.display!=="none"){unlock();}});
let MANUAL=[];
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function nowStr(){const d=new Date();return todayStr()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function allIdeas(){return IDEAS.concat(MANUAL).sort((a,b)=>(b.ref_dt||"").localeCompare(a.ref_dt||""));}
const IDEA_API="https://api.github.com/repos/god-hu/workbench/contents/ideas.json";
async function loadIdeas(){
  if(!PWD)return;
  try{
    const r=await fetch(IDEA_API,{headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"}});
    if(r.ok){const meta=await r.json();if(meta&&meta.content){const obj=JSON.parse(atob(stripB64(meta.content)));const plain=await aesDecrypt(obj.ct,obj.iv,PWD);const data=JSON.parse(plain);if(Array.isArray(data.manual))MANUAL=data.manual;}}
  }catch(e){}
  if((state.mode==="ideas")||(state.tab==="ideas"))render();
}
async function addIdea(){
  const ta=document.getElementById("ideaInput");const text=(ta.value||"").trim();
  if(!text){ta.focus();return;}
  if(!PWD){alert("请先解锁");return;}
  const btn=document.getElementById("ideaAddBtn");btn.disabled=true;const old=btn.textContent;btn.textContent="保存…";
  try{
    const r=await fetch(IDEA_API,{headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"}});
    let oldSha=null,arr=[];
    if(r.ok){const cur=await r.json();oldSha=cur.sha;if(cur.content){const obj=JSON.parse(atob(stripB64(cur.content)));const plain=await aesDecrypt(obj.ct,obj.iv,PWD);const data=JSON.parse(plain);arr=data.manual||[];}}
    arr.unshift({text,ref_date:todayStr(),ref_dt:nowStr(),ts:Date.now()});
    const enc=await encryptIdeas(arr,PWD);
    const body={message:"add idea",content:btoa(JSON.stringify(enc))};
    if(oldSha)body.sha=oldSha;
    const put=await fetch(IDEA_API,{method:"PUT",headers:{Authorization:"Bearer "+GH_TOKEN,"Content-Type":"application/json",Accept:"application/vnd.github+json"},body:JSON.stringify(body)});
    if(!put.ok)throw new Error("保存失败");
    MANUAL=arr;ta.value="";render();
  }catch(e){alert("保存失败："+e.message);}
  finally{btn.disabled=false;btn.textContent=old;}
}
async function deleteIdea(ts){
  if(!confirm("删除这条灵感？"))return;
  try{
    const r=await fetch(IDEA_API,{headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"}});
    const cur=await r.json();let arr=[];if(cur.content){const obj=JSON.parse(atob(stripB64(cur.content)));const plain=await aesDecrypt(obj.ct,obj.iv,PWD);const data=JSON.parse(plain);arr=data.manual||[];}
    arr=arr.filter(x=>x.ts!==ts);
    const enc=await encryptIdeas(arr,PWD);
    const body={message:"del idea",content:btoa(JSON.stringify(enc))};
    if(cur.sha)body.sha=cur.sha;
    const put=await fetch(IDEA_API,{method:"PUT",headers:{Authorization:"Bearer "+GH_TOKEN,"Content-Type":"application/json",Accept:"application/vnd.github+json"},body:JSON.stringify(body)});
    if(!put.ok)throw new Error("删除失败");
    MANUAL=arr;render();
  }catch(e){alert("删除失败："+e.message);}
}
const CAT_COLOR = {"爆款素材":"#cfe3d6","搜索文章":"#d6e0ee","原创文章":"#efe7dd","排版稿":"#e7e0ef","标题产出":"#e3ece4","选题产出":"#e9e2d6","其他产出":"#e8e8e8"};
const WS_COLORS = ["#5f6b7a","#7a8b7a","#a08a6a","#8a7a8b","#6a7d8b","#8b7a6a","#7d6a6a","#6a7d7a","#7a6a7d"];
function wsColor(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;return WS_COLORS[h%WS_COLORS.length];}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fileUrl(p){return "file:///"+p.replace(/\\/g,"/");}
let state={tab:"timeline",ws:"",q:""};
function wsList(){const m={};D.forEach(s=>{m[s.workspace]=(m[s.workspace]||0)+1;});
  const arr=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  const other=arr.find(x=>x[0]==="其他");const main=arr.filter(x=>x[0]!=="其他");
  return main.concat(other?[other]:[]);}
function catList(){const m={};D.forEach(s=>s.files.forEach(f=>{m[f.category]=(m[f.category]||0)+1;}));
  const order=["爆款素材","搜索文章"];
  return order.filter(k=>m[k]);}
function statsOf(list){const days=new Set(list.map(s=>s.ref_date)).size;
  const files=list.reduce((a,s)=>a+s.files.length,0);
  const doing=list.filter(s=>s.status==="进行中").length;
  return {sessions:list.length,files,days,doing};}
function catCount(name){let c=0;D.forEach(s=>s.files.forEach(f=>{if(f.category===name)c++;}));return c;}
function filtered(){let list=D;
  if(state.tab==="timeline"&&state.ws) list=list.filter(s=>s.workspace===state.ws);
  if(state.q){const q=state.q.toLowerCase();
    list=list.filter(s=>{(s.title+"").toLowerCase().includes(q)||(s.summary+"").toLowerCase().includes(q)||
      s.files.some(f=>(f.name+"").toLowerCase().includes(q)||(f.path+"").toLowerCase().includes(q));});}
  return list;}
function fileChip(f){const col=CAT_COLOR[f.category]||"#ccc";
  return `<a class="file" href="${esc(fileUrl(f.path))}" target="_blank" title="${esc(f.path)}">
    <span class="dot" style="background:${col}"></span>
    <span class="fname">${esc(f.name)}</span>
    <span class="fcat">${esc(f.category)}</span>
    <span class="fkind">${esc(f.kind)}</span></a>`;}
function sessionCard(s){const fc=s.files.length;
  const fcollapsed=fc>3?"collapsed":"";const fchev=fc>3?"&#9656;":"&#9662;";
  return `<div class="card">
    <div class="row1">
      <span class="ws" style="background:${wsColor(s.workspace)}">${esc(s.workspace[0])}</span>
      <span class="title">${esc(s.title)}</span>
      <span class="pill ${s.status==='进行中'?'doing':'done'}">${esc(s.status)}</span>
    </div>
    ${s.summary?`<div class="sum">${esc(s.summary)}</div>`:""}
    <div class="ftime">${esc(s.ref_dt)} · ${fc} 个文件</div>
    ${fc?`<div class="file-toggle" onclick="toggleFiles('${esc(s.id)}')">
        <span>文件（${fc}）</span><span class="chev" id="chev-files-${esc(s.id)}">${fchev}</span>
      </div>
      <div class="files ${fcollapsed}" id="files-${esc(s.id)}">${s.files.map(fileChip).join("")}</div>`:""}
  </div>`;}
function wsChipsHtml(){const ws=wsList();
  const all=`<div class="wschip ${state.ws===''?'active':''}" onclick="setWs('')">全部</div>`;
  const rest=ws.map(([n,c])=>`<div class="wschip ${state.ws===n?'active':''}" onclick="setWs('${esc(n)}')">${esc(n)}</div>`).join("");
  return `<div class="wsbar">${all}${rest}</div>`;}
function timelineView(list){const byDay={};
  list.forEach(s=>{(byDay[s.ref_date]=byDay[s.ref_date]||[]).push(s);});
  const days=Object.keys(byDay).sort().reverse();
  if(!days.length) return `<div class="empty">没有匹配的内容</div>`;
  const body=days.map(d=>{const arr=byDay[d].slice().sort((a,b)=>b.ref_dt.localeCompare(a.ref_dt));
    return `<div class="day" id="day-${esc(d)}"><div class="day-head" onclick="toggleDay('${esc(d)}')">
        <span class="chev" id="chev-day-${esc(d)}">&#9662;</span>
        <span class="date">${esc(d)}</span><span class="wcount">${arr.length} 个会话</span></div>
      <div class="cards">${arr.map(sessionCard).join("")}</div></div>`;}).join("");
  return wsChipsHtml()+body;}
function libraryView(){const cat=catList();
  if(!cat.length) return `<div class="empty">暂无素材</div>`;
  return cat.map(name=>{const items=[];
    D.forEach(s=>s.files.forEach(f=>{if(f.category===name){
      if(state.q){const q=state.q.toLowerCase();
        if(!((f.name+"").toLowerCase().includes(q)||(f.path+"").toLowerCase().includes(q)||(s.title+"").toLowerCase().includes(q)))return;}
      items.push({f,s});}}));
    items.sort((a,b)=>b.s.ref_dt.localeCompare(a.s.ref_dt));
    if(!items.length) return "";
    return `<div class="lib-sec"><h3><span class="tag" style="background:${CAT_COLOR[name]||'#ccc'}"></span>${esc(name)}<span class="c">${items.length} 个</span></h3>
      <div class="lib-grid">${items.map(({f,s})=>`<div class="lib-card">
        <a class="fn" href="${esc(fileUrl(f.path))}" target="_blank" style="color:${wsColor(s.workspace)}">${esc(f.name)}</a>
        <div class="meta2"><span class="pill ${s.status==='进行中'?'doing':'done'}">${esc(s.status)}</span>
          <span>${esc(s.workspace)}</span><span>${esc(s.ref_date)}</span><span>${esc(f.kind)}</span></div>
        <div class="path" onclick="copyPath('${esc(f.path)}')">${esc(f.path)}</div>
      </div>`).join("")}</div></div>`;}).join("");}
function overviewView(){const st=statsOf(D);const ws=wsList();
  return `<div class="ov-grid">
    <div class="ov-card"><div class="ov-num">${st.sessions}</div><div class="ov-lbl">会话</div></div>
    <div class="ov-card"><div class="ov-num">${st.files}</div><div class="ov-lbl">生成文件</div></div>
    <div class="ov-card"><div class="ov-num">${st.days}</div><div class="ov-lbl">活跃天数</div></div>
    <div class="ov-card"><div class="ov-num">${st.doing}</div><div class="ov-lbl">进行中</div></div>
  </div>
  <div class="ov-ws"><div style="font-size:13px;color:var(--sub);margin-bottom:6px">工作空间分布</div>
    ${ws.map(([n,c])=>`<div class="row"><span><span class="ws" style="width:18px;height:18px;font-size:10px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;margin-right:6px;background:${wsColor(n)}">${esc(n[0])}</span>${esc(n)}</span><span class="n">${c}</span></div>`).join("")}
  </div>`;}
function ideasViewMobile(){
  const list=allIdeas();
  const addBox=`<div class="idea-add">
    <textarea id="ideaInput" placeholder="记一条灵感…"></textarea>
    <button id="ideaAddBtn" onclick="addIdea()">添加</button>
  </div>`;
  if(!list.length) return addBox+`<div class="empty">还没有灵感。可以直接在这里添加，或在电脑端 WorkBuddy 说“灵感：xxx”。</div>`;
  let f=list;
  if(state.q){const q=state.q.toLowerCase();f=f.filter(i=>(i.text+"").toLowerCase().includes(q));}
  return addBox+`<div class="hint" style="font-size:12px;color:#9aa3ad;padding:2px 2px 8px">手动添加的与 WorkBuddy 记录的灵感都会显示在这里</div>`+
    f.map(i=>{const del=i.ts?`<span class="idea-del" onclick="deleteIdea(${i.ts})">删除</span>`:"";
    return `<div class="card" style="border-left:3px solid var(--accent)">
      <div class="sum" style="-webkit-line-clamp:8">${esc(i.text)}</div>
      <div class="ftime">${esc(i.ref_dt)} ${del}</div></div>`;}).join("");
}
function render(){document.getElementById("tab-timeline").classList.toggle("active",state.tab==="timeline");
  document.getElementById("tab-material").classList.toggle("active",state.tab==="material");
  document.getElementById("tab-ideas").classList.toggle("active",state.tab==="ideas");
  document.getElementById("tab-overview").classList.toggle("active",state.tab==="overview");
  document.getElementById("dnav-timeline").classList.toggle("active",state.tab==="timeline");
  document.getElementById("dnav-material").classList.toggle("active",state.tab==="material");
  document.getElementById("dnav-ideas").classList.toggle("active",state.tab==="ideas");
  document.getElementById("dnav-overview").classList.toggle("active",state.tab==="overview");
  const main=document.getElementById("main");
  if(state.tab==="timeline") main.innerHTML=timelineView(filtered());
  else if(state.tab==="material") main.innerHTML=libraryView();
  else if(state.tab==="ideas") main.innerHTML=ideasViewMobile();
  else main.innerHTML=overviewView();}
function goTab(t){state.tab=t;if(t!=="timeline")state.ws="";render();window.scrollTo({top:0,behavior:"smooth"});}
function openDrawer(){document.getElementById("drawer").classList.add("show");document.getElementById("mask").classList.add("show");}
function closeDrawer(){document.getElementById("drawer").classList.remove("show");document.getElementById("mask").classList.remove("show");}
function setWs(n){state.ws=n;render();window.scrollTo({top:0,behavior:"smooth"});}
function onSearch(v){state.q=v;render();}
function toggleDay(d){const el=document.getElementById("day-"+d);if(!el)return;
  el.classList.toggle("collapsed");const c=document.getElementById("chev-day-"+d);
  if(c)c.textContent=el.classList.contains("collapsed")?"&#9656;":"&#9662;";}
function toggleFiles(id){const el=document.getElementById("files-"+id);if(!el)return;
  el.classList.toggle("collapsed");const c=document.getElementById("chev-files-"+id);
  if(c)c.textContent=el.classList.contains("collapsed")?"&#9656;":"&#9662;";}
function copyPath(p){if(navigator.clipboard){navigator.clipboard.writeText(p).then(()=>alert("已复制路径：\n"+p));}else{alert("路径：\n"+p);}}
// 首屏锁：解锁后由 unlock() 调用 render()+loadIdeas()
</script>
