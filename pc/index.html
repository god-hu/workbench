<title>每日工作台</title>
<style>
:root{
  --bg:#f5f3ef; --panel:#faf9f6; --card:#ffffff; --border:#ebe7e0;
  --ink:#2e2b27; --sub:#8d877d; --line:#efece6;
  --accent:#5f6b7a; --accent-soft:#eef1f4;
  --done-bg:#e9f0ea; --done-ink:#5a7d63;
  --doing-bg:#f4ece0; --doing-ink:#b08342;
  --cat-xuan:#dde4ee; --cat-biao:#e3ece4; --cat-wen:#efe9e2; --cat-pai:#e9e4ee; --cat-qi:#ededed;
  --shadow:0 1px 3px rgba(40,36,30,.06),0 6px 18px rgba(40,36,30,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;}
a{color:inherit;text-decoration:none}
.app{display:flex;min-height:100vh}
/* 侧栏 */
.sidebar{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
.nav-group{margin-bottom:20px}
.nav-title{font-size:11px;color:var(--sub);letter-spacing:1.5px;padding:0 10px 8px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);font-size:14px;margin-bottom:2px}
.nav-item:hover{background:var(--card)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .cnt{font-size:12px;color:var(--sub);background:var(--bg);border-radius:20px;padding:1px 8px;min-width:24px;text-align:center}
.nav-item.active .cnt{color:var(--accent);background:#fff}
.ws-badge{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;flex:0 0 22px}
/* 主区 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:rgba(245,243,239,.88);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:16px 26px 14px}
.topbar h2{margin:0 0 4px;font-size:19px;font-weight:700}
.topbar .meta{font-size:12.5px;color:var(--sub);margin-bottom:12px}
.search{display:flex;gap:8px}
.search input{flex:1;border:1px solid var(--border);background:var(--card);border-radius:10px;
  padding:10px 12px;font-size:14px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.content{padding:22px 26px 60px;flex:1}
/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.stat .num{font-size:26px;font-weight:700;letter-spacing:.5px}
.stat .lab{font-size:12.5px;color:var(--sub);margin-top:2px}
/* 时间线 */
.day{margin-bottom:26px}
.day-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px dashed var(--line);cursor:pointer;user-select:none}
.day-head .date{font-size:15px;font-weight:700}
.day-head .wcount{font-size:12.5px;color:var(--sub)}
.day-head .chev{display:inline-block;transition:transform .15s;color:var(--sub);font-size:12px;width:12px;text-align:center}
.day.collapsed .cards{display:none}
.day.collapsed .day-head .chev{transform:rotate(-90deg)}
.files.collapsed{display:none}
.file-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:var(--sub);
  font-size:12px;padding:5px 2px 3px;user-select:none;margin-top:2px;border-top:1px solid var(--line)}
.file-toggle .chev{transition:transform .15s;font-size:11px}
.foldbtn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px 14px;
  font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.foldbtn:hover{background:var(--accent-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 16px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card .row1{display:flex;align-items:center;gap:9px}
.card .row1 .ws{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:700;flex:0 0 26px}
.card .row1 .title{flex:1;font-weight:650;font-size:15px;line-height:1.35}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.pill.done{background:var(--done-bg);color:var(--done-ink)}
.pill.doing{background:var(--doing-bg);color:var(--doing-ink)}
.card .sum{font-size:13px;color:var(--sub);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ftime{font-size:11.5px;color:var(--sub)}
.files{display:flex;flex-direction:column;gap:6px;margin-top:2px;border-top:1px solid var(--line);padding-top:9px}
.file{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--bg);cursor:pointer}
.file:hover{background:var(--accent-soft)}
.file .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.file .fname{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fkind{font-size:10.5px;color:var(--sub);background:#fff;border:1px solid var(--border);border-radius:6px;padding:0 6px}
.file .fcat{font-size:10.5px;color:var(--sub)}
/* 素材库平铺 */
.lib-note{font-size:13px;color:var(--sub);margin-bottom:14px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lib-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}
.lib-card .fn{font-weight:600;font-size:14px;word-break:break-all}
.lib-card .meta2{font-size:12px;color:var(--sub);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lib-card .path{font-size:11px;color:var(--sub);margin-top:7px;word-break:break-all;opacity:.85}
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px}
/* 手机顶栏 */
.mtop{display:none}
@media(max-width:820px){
  .app{flex-direction:column}
  .sidebar{display:none}
  .mtop{display:flex;position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--border);
    overflow-x:auto;gap:8px;padding:12px 14px;-webkit-overflow-scrolling:touch}
  .mtop .mbtn{flex:0 0 auto;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);
    font-size:13px;color:var(--ink);white-space:nowrap}
  .mtop .mbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .topbar{padding:14px 16px 10px;position:static}
  .content{padding:16px 14px 50px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .cards,.lib-grid{grid-template-columns:1fr}
}
.drawer-mask{display:none}.drawer{display:none}
@media(max-width:820px){
  .drawer-mask.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
  .drawer{display:block;position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--panel);
    z-index:21;transform:translateX(-100%);transition:transform .22s;overflow-y:auto;padding:22px 14px}
  .drawer.show{transform:translateX(0)}
}
</style>

f", "project": "g-workbuddy-2026-07-29-00-02-20", "cwd": "", "title": "晚上好</user_query>", "first_request": "晚上好</user_query>", "last_role": "assistant", "files": [], "msg_count": 2, "ideas": [], "workspace": "其他", "summary": "晚上好</user_query>", "status": "已完成", "ref_date": "2026-07-29", "ref_dt": "2026-07-29 00:02"}, {"id": "8cd9ce14-758e-4ccb-a84d-730c5c32e056", "project": "g-workbuddy-木心sop", "cwd": "g:\\workbuddy\\木心SOP", "title": "@skill:gzh-design 这篇文章排下版 @image#1:x", "first_request": "@skill:gzh-design 这篇文章排下版 @image#1:xiaohei_inline_1_torn_tag_1785222663972.jpg @image#2:xiaohei_inline_2_own_umbrella_1785222673416.jpg「生命就是时时刻刻不知道如何是好，女人最硬的底气，是脸，还是钱包？」\n\n别人兜里的钱，跟你没有一毛钱关系 我闺蜜小雅，上周发了条朋友圈。配图是她老公送的包。评论区一水儿的羡慕：好幸福啊，你老公真舍得。\n她秒删了。私信我：这包是我自己买的，我不敢说。我问为什么？她说：标签我撕了。怕他看见价格，觉得我乱花钱。\n一个自己买包还要撕标签的女人。你品品这句话。\n\n很多人跟我说：你就写写感情算了，别老鼓吹女人挣钱。\n仿佛女人对财富的渴望，天然就比男人多了一层需要辩解的意味。\n以前的我，也不是完全不认同这种说法。女人何必那么辛苦地赚钱？找个条件好的人，不也一样能过上好日子吗？\n后来我见过太多人的生活，才明白：你以为是在找靠山，实际上，可能是在把自己的人生交到别人手里。这个真相，远比“没钱”更残忍。\n小雅结婚前，在广告公司做策划，到手五千出头，房租一交就光。结婚后，老公说，你别那么累了，我养你。她真信了。三年。她没再上班。今年闹离婚，她翻银行卡，名下存款：两千三。\n一个女人最可怕的，不是穷，是穷得连“不”都说不出口。\n\n\n所谓安全感，是你自己手里的那把伞 再说阿琳。阿琳是我前同事，长得漂亮，二十八岁嫁了个做生意的。我们都说她命好。去年她老公生意垮了，欠了一屁股债。债主找上门，她才知道，房子车子早抵押了，她名下啥也没有。\n最惨的不是没钱。是她想重新开始，发现自己除了“谁谁谁老婆”，什么技能都没剩。\n\n所谓安全感，不是有人给你遮风，是你自己有把伞。\n\n“反正是要嫁人”，是这世上最毒的安慰剂\n它表面上是在劝女人别太辛苦，实际上是在劝女人别太强。\n\n别太会赚钱，别太有主见，别把路走得太宽——毕竟，最后总要嫁人。\n可荒唐的是，当女人真的靠自己买房、挣钱、拥有选择权，又总有人开始不舒服。\n晓雯36岁，自己买房，年薪四十万。相亲时对方听到她的收入，脸马上垮了：你挣得比我多，以后谁养家？晓雯回他：我不需要你养。我自己养得起自己。\n这才是问题的核心：有些人说“反正要嫁人”，并不是希望你过得轻松，而是希望你别强到不再需要任何人。\n可凭什么？\n\n凭什么男人拼事业叫有出息，女人拼事业就叫不顾家？\n\n凭什么我读书、工作、熬夜、向上爬，最后要被一句“反正要嫁人”轻轻抹掉？\n婚姻可以是选择，但绝不能成为女人放弃变强的理由。\n钱最大的意义，不是你能买什么，是你能对不喜欢的生活说“不”。\n\n一个女人真正的成熟，\n不是学会示弱，是终于敢自己养自己。\n\n女人最硬的底气，不是脸，也不是钱包。\n是哪怕两张牌都不灵了，你还能扶自己一把。</user_query>\n\nC:/Users/Administrator/.gemini/antigravity/brain/b41bdd89-f2c8-47ae-a09d-088dd1c0d8d2/xiaohei_inline_1_torn_tag_1785222663972.jpg</image_local_path>\n\nC:/Users/Administrator/.gemini/antigravity/brain/b41bdd89-f2c8-47ae-a09d-088dd1c0d8d2/xiaohei_inline_2_ow ", "name": "2026-07-27.md", "category": "原创文章"}, {"path": "g:\\workbuddy\\2026-07-27-22-24-56\\generated-images\\Cinematic_film_still__vertical_2026-07-27T14-26-52.png", "note": "AFTER THE RAIN 海报主视觉氛围图（AI 生成，铁青/锈橙双色调，雨后深夜孤独背影）", "kind": "交付", "name": "Cinematic_film_still__vertical_2026-07-27T14-26-52.png", "category": "其他产出"}], "msg_count": 11, "ideas": [], "workspace": "其他", "summary": "@scene#32:\"视觉海报\" 帮我做一张独立电影展海报，竖版 1080×1620，文艺片调性。 风格：电影级双色调（teal-blue + rust orange），神秘忧郁感。主视觉用一张 AI 氛围图占满全幅——雨后深夜空荡城市街道，一个孤独人物背影站在街心，头顶路灯逆光", "status": "已完成", "ref_date": "2026-07-27", "ref_dt": "2026-07-27 22:25"}, {"id": "07d324bf-58a9-427e-9211-e58bee941b63", "project": "g-workbuddy-公众号SOP", "cwd": "g:\\workbuddy\\公众号SOP", "title": "@skill:ian-xiaohei-scenes 用下面内容生成2张配", "first_request": "@skill:ian-xiaohei-scenes 用下面内容生成2张配图# 现在开始是不是太晚了？最近经常收到一类问题，翻来覆去就是一个意思：我现在才想要做某件事，是不是太晚了？发这种消息的人年龄跨度很大。二十岁的问现在学一门新技能是不是太晚了，三十岁的问现在换行业是不是太晚了，四十岁的问现在开始锻炼是不是太晚了，五十岁的问现在学一门乐器是不是太晚了。我有时候看着这些留言会想——他们期待的究竟是一个什么样的答案？如果说\"不晚\"，他们会不会就真的去做了？我猜不会。他们会继续等，等到下一个\"更合适\"的时机。说是问晚不晚，其实是在等一个许可。等有人告诉他们：你准备好了，去吧。---以前我并不这么想。以前我觉得人们是真的在寻求建议，是真的不确定时机是否合适。后来我发现不是那么回事。Mark Manson 说他每天都能收到从二十岁到八十岁的人发来的邮件，内容一模一样——\"现在开始是不是太晚了？\"他说他见过一个最极端的例子：朋友的婆婆，六十二岁，丈夫去世后开始学钢琴。每天练，练了几十年。后来她演奏莫扎特、贝多芬、巴赫的时候，所有人都以为她从小就是钢琴家。六十二岁才开始。这中间有一个很微妙的错位。问\"是不是太晚了\"的人，普遍在三四十岁，身强力壮，精力充沛。而那个六十二岁才开始学琴的人，根本没问过这个问题——她直接就去了。---差别在哪里？差别在于问问题的人以为自己需要的答案是\"来得及\"还是\"来不及\"，但他们真正需要的是一种行动的能力。这种能力跟时间没有关系，跟年龄没有关系，甚至跟信心也没有关系。我自己有个体会。每次我拖了很久没写一篇文章，越拖就越觉得\"写不出来\"，状态不对，灵感没到，时机不好。终于有一天被逼得没办法坐在电脑前开始敲第一个字——十分钟之后，之前的那些障碍全部消失了。动作本身就能解决大部分问题，但你必须先做一个动作。Mark Manson 有一句话说得很好：动力不是行动的原因，而是行动的结果。这话反直觉，因为大部分人把因果关系搞反了。大家认为要先有动力才能行动，但真实情况是——你先动起来，动力才会出现。就像你不可能等到\"准备好了\"才去跑步，你穿上鞋跑起来的那一刻，才是真正的准备。---Mark Manson 自己二十七岁才开始写作。二十七岁，在今天的标准来看已经是\"大龄青年\"了。三十六岁才开始拍视频。他现在是全世界最畅销的作者之一，但你要知道，在那之前他写了很多年没人看的东西。人们很容易产生一种错觉——看到一个人做成了某件事，就觉得他一定是天赋异禀，从小就是这块料。但实际上，大部分人的真实轨迹是：开始得很晚，做得一般，坚持了很久，突然有一天发现好像还行。这不是什么励志故事，这只是统计学上的事实。因为大多数人在二十岁的时候根本不知道自己想要什么，三十岁也不一定知道。真正知道自己要什么的，是那些已经开始做了的人——他们做着做着就知道了。---我有一个可能不太讨人喜欢的看法。我觉得问\"是不是太晚了\"的人，心里清楚答案是什么。他们只是不想听那个答案。如果真的觉得太晚了，他们不会问。如果真的觉得不晚，他们也不会问。问了，说明他们处在中间地带——知道应该去做，又害怕做了之后证明自己不行。于是用一个问题来拖延，把责任外包给一个陌生人的回答。所以我现在的回复越来越短了。以前我会认真分析，讲道理，举例子。现在我通常就说一句：你觉得呢？---那句老话其实只说对了一半。种一棵树最好的时间是十年前，其次是现在。但这句话忽略了一个问题——那些十年前没种树的人，现在大概率也不会去种。他们会继续等，等到又一个十年过去，然后对自己说：你看，果然太晚了。所以真正的答案不是\"晚不晚\"，而是你愿不愿意接受一个事实：从现在开始的每一步，都比你站在原地问问题更接近你想要的东西。六十二岁开始弹钢琴的那位老太太，大概从来没想过自己会成为什么钢琴家。她就是每天练。练着练着，几十年过去了。她没有等一个\"合适的时间\"，因为她知道没有这种东西。你猜她是什么时候想通的？我猜就是她丈夫去世后的某一天。她也曾坐在那里想——现在开始是不是太晚了？然后她站起来，走向了钢琴。就这么简单。就这么难。@skill:ardot-design-core @skill:ardot-design-router</user_query>", "last_role": "assistant", "files": [{"path": "G:\\workbuddy\\公众号SOP\\配图\\现在开始是不是太晚了\\01_等许可的人.png", "note": "为公众号文章「现在开始是不是太晚了？」生成的 2 张 16:9 小黑场景配图：门前迟疑（等待许可）与钢琴前落手（六十二岁开始）。", "kind": "交付", "name": "01_等许可的人.png", "category": "其他产出"}, {"path": "G:\\workbuddy\\公众号SOP\\配图\\现在开始是不是太晚了\\02_六十二岁坐到钢琴前的人.png", "note": "为公众号文章「现在开始是不是太晚了？」生成的 2 张 16:9 小黑场景配图：门前迟疑（等待许可）与钢琴前落手（六十二岁开始）。", "kind": "交付", "name": "02_六十二岁坐到钢琴前的人.png", "category": "其他产出"}, {"path": "G:/workbuddy/公众号SOP/.workbuddy/memory/2026-07-27.md", "note": ".workbuddy\\memory\\2026-07-27.md", "kind": "修改", "name": "2026-07-27.md", "category": "原创文章"}], "msg_count": 35, "ideas": [], "workspace": "公众号SOP", "summary": "@skill:ian-xiaohei-scenes 用下面内容生成2张配图# 现在开始是不是太晚了？最近经常收到一类问题，翻来覆去就是一个意思：我现在才想要做某件事，是不是太晚了？发这种消息的人年龄跨度很大。二十岁的问现在学一门新技能是不是太晚了，三十岁的问现在换行业是不是太晚了", "status": "已完成", "ref_date": "2026-07-27", "ref_dt": "2026-07-27 21:38"}, {"id": "agent-17f543b2", "project": "subagents", "cwd": "", "title": "Base directory for this skill: C:\\Us", "first_request": "Base directory for this skill: C:\\Users\\Administrator\\.workbuddy\\skills\\ian-xiaohei-scenes\n# Ian 小黑实物场景图\r\n\r\n## 核心定位\r\n\r\n把文章观点、用户处境、个人经历、项目过程、产品演化和内容资产，转译成一张可传播的“真实物件小现场”或“真实物件人生线”：\r\n\r\n```text\r\n小黑 + 真实物件 + 物理动作 + 短中文标签 + 留白叙事\r\n```\r\n\r\n这不是 1.0 的纯手绘解释图，也不是 PPT 信息图。2.0 的目标是让读者先看到一个真实、轻、怪的现场，再在 1 秒内意识到“这说的就是我”。\r\n\r\n本 Skill 有两种输出规格：\r\n\r\n- **标准模式**：16:9 正文配图，一个真实物件小现场，默认纯白 `#FFFFFF` 背景。\r\n- **彩蛋模式**：小黑长卷故事图，一条超横版真实物件人生线，用于个人经历、项目复盘、产品演化、成长路径和内容资产演进。它以 `assets/examples/07-long-scroll-story-master.png` 为核心母版，使用高级近白背景，不强制死白。\r\n\r\n## 和 1.0 的区别\r\n\r\n- 1.0：更像白板上的手绘逻辑图，适合拆文章、拆流程、拆方法。\r\n- 2.0：更像白色摄影棚里的真实物件现场，适合表达处境、情绪、项目故事、产品故事和正文观点隐喻。\r\n\r\n如果用户要求“纯手绘小黑解释图 / 白板风流程图 / 手绘方法论图”，优先用 `$ian-xiaohei-illustrations`。如果用户要求“真实物件 / 实物图 / 小黑 + 物件 / 打工人共鸣 / 更有生活质感 / 小黑 2.0”，用本 Skill。\r\n\r\n## Before Starting\r\n\r\n按任务需要读取，不要一次全部塞进上下文：\r\n\r\n- `references/style-dna.md`：2.0 视觉 DNA、比例、留白、颜色、真实物件规则。\r\n- `references/xiaohei-ip.md`：小黑 IP 在 2.0 里的形体弹性、动作和禁忌。\r\n- `references/story-extraction.md`：如何从正文里提炼用户处境、物理动作和短标签。\r\n- `references/object-patterns.md`：真实物件选择、场景类型、原创隐喻和反复刻规则。\r\n- `references/master-selection.md`：标准模式 01-06 母版选择、质量锚点、变异要求和出图拦截规则。\r\n- `references/prompt-template.md`：单张生图提示词模板。\r\n- `references/qa-checklist.md`：生成后质量检查、失败信号和迭代方向。\r\n- `assets/examples/`：高质量模板母版和出图质量标尺。`01-06` 是标准 16:9 质量锚点；`07-long-scroll-story-master.png` 是彩蛋长卷模式唯一核心母版。标准图必须对齐它们的比例、留白、物件真实感、小黑气质、短标签密度、点缀色节奏和动作清晰度；不要复刻物件组合、空间拓扑、小黑姿态或标签位置。\r\n\r\n开始前确认：\r\n\r\n- 用户是否明确要标准 16:9 正文图，还是彩蛋长卷故事图。\r\n- 用户是否提供了必须保留的人名、品牌名、项目名或经历节点。\r\n- 如果没有明确要求生成图片，只先输出 shot list 或配图方案。\r\n- 如果用户要求“看效果 / 输出 / 生成”，标准模式必须先选择 01-06 中最匹配的母版；彩蛋模式必须锁定 07。没有母版锁定，不进入生图。\r\n- 如果对话上下文里没有刚刚看过对应母版，生成前必须查看所选母版图；生成后必须查看候选图再交付。\r\n\r\n## Core Flow\r\n\r\n### 1. 消化内容\r\n\r\n先提炼当前内容里的“处境”，不要急着找物件：\r\n\r\n- 这张图要让谁产生共鸣？\r\n- 他们正在被什么东西拉扯、筛选、压住、拽回、催促、重组？\r\n- 抽象概念能变成什么物理动作？\r\n- 哪 2-4 个短词能一秒戳中痛点？\r\n- 哪个真实物件天然承载这个处境？\r\n\r\n优先选择高共鸣节点：会议、消息、返工、审查、筛选、加码、被替代、下班失败、项目卡住、内容资产沉淀、产品演化断点。\r\n\r\n如果用户要求彩蛋模式，先把内容拆成 5-8 个连续节点：\r\n\r\n- 左侧起点：身份、起点、最初处境。\r\n- 中间节点：关键经历、项目转折、内容资产、产品演化。\r\n- 右侧终点：现在在做什么、核心关注、结论或下一阶段。\r\n- 每个节点都要有一个真实物件、小黑动作和 1-3 行短注释。\r\n\r\n完成标记：已经明确读者处境、核心冲突、真实物件、小黑动作和短中文标签；彩蛋模式已经得到 5-8 个可视化节点。\r\n\r\n### 1B. 事实锚定\r\n\r\n涉及个人经历、品牌名、公司名、项目名、粉丝数、时间跨度、成绩数字时，只能使用用户输入、用户提供素材或用户明确确认的事实。\r\n\r\n- 用户没有提供的事实，不要从母版继承，也不要补成看起来更完整的履历。\r\n- 无法确认的内容，用概括性标签替代，例如“内容平台”“项目节点”“用户反馈”“产品实验”。\r\n- 如果用户要求保留但信息不完整，在 shot list 或交付说明里标注“待确认”，不要把它画成确定事实。\r\n\r\n完成标记：所有具体事实都能回到用户输入或素材；不能回溯的事实已删除、抽象化或标注待确认。\r\n\r\n### 2. 先出 shot list\r\n\r\n如果用户说“分析 / 思考 / 怎么配图”，先给 shot list。每张写清：\r\n\r\n- 使用哪张母版\r\n- 图的主题\r\n- 读者共鸣点\r\n- 物理动作\r\n- 真实主物件\r\n- 小黑在做什么\r\n- 中文短标签\r\n- 为什么这张值得画\r\n\r\n标准模式默认 4-8 张。彩蛋模式默认先出 1 张长卷母版效果图。用户明确要“看效果 / 输出 / 生成”时，直接生图，不要停在方案，但仍必须先在内部完成 2B 母版锁定。\r\n\r\n完成标记：每个候选画面都有母版、主题、共鸣点、物理动作、真实主物件、小黑动作、短标签和成图理由。\r\n\r\n### 2B. 母版锁定（标准模式强制）\r\n\r\n标准模式每张图在生成前必须先完成母版锁定。读取 `references/master-selection.md`，从 `01-06` 里选一张最匹配的质量锚点。母版不是可复制构图；不要把案例的手机、纸条、沙漏、电脑、放大镜等空间拓扑直接搬过来。\r\n\r\n必填字段：\r\n\r\n```text\r\n母版：\r\n抽取的不变量：\r\n当前内容的变异点：\r\n画面 3 秒读懂句：\r\n当前内容适配：\r\n要避免的失败信号：\r\n```\r\n\r\n选择原则：\r\n\r\n- 下班失败、报警、返工回流、问题打结：优先 `03-production-alert`。\r\n- 消息涌出、任务过载：优先 `02-message-overload`。\r\n- 会议 / 同步 / 对齐把人拉回：优先 `01-meeting-pull-in`。\r\n- 审查 / 校对 / 兜底 / 返工检查：优先 `04-code-review-rework`。\r\n- AI 自动化、岗位重组、身份标签变化：优先 `05-ai-automation-badge`。\r\n- 筛选 / 过滤 / 关键词 / 机会流失：优先 `06-ai-resume-filter`。\r\n\r\n如果当前内容不完全匹配任何母版，也要选择最接近的一张作为比例、留白和信息密度标尺，然后重写物件、动作和标签。\r\n\r\n变异要求：\r\n\r\n- 至少 3 项和母版不同：主物件类别、空间方向、小黑动作、道具组合、标签位置、视角或叙事重心。\r\n- 如果主物件和母版相同，空间关系和小黑动作必须明显不同。\r\n- 如果空间关系和母版相近，主物件、动作和配件必须明显不同。\r\n- 不能把母版案例做成换字版。第一眼像旧案例换主题，即失败。\r\n\r\n硬性预算：\r\n\r\n- 只能有一个核心物理动作。\r\n- 只能有一个真实主物件或紧凑主物件组。\r\n- 最多 1-2 个小配件。\r\n- 最多 4 个短标签，优先 3 个。\r\n- 禁止把主题里的所有名词都画出来。出现“元素清单化”时，先删减再生成。\r\n- 单个深色大物件不能支配画面；手机、电脑、黑色盒子等深色主物件要缩小或换成更轻的实物锚点。\r\n- 整体场景要比母版更轻或同等轻，不能更满、更大、更重。\r\n\r\n完成标记：每张标准图都有明确母版、不变量、至少 3 个变异点、3 秒读懂句、适配点和失败信号；没有元素清单化或母版复刻化。\r\n\r\n### 3. 单张生成\r\n\r\n每张图单独生成，不要把多张拼成一张。\r\n\r\n默认用 16:9 横版。提示词必须包含：\r\n\r\n- 母版锁定：使用哪张 01-06 案例作为质量锚点，抽取哪些不变量，当前图如何做至少 3 个变异。\r\n- `#FFFFFF` 纯白背景和白色摄影棚表面，不能是灰白、暖白、米白、渐变或暗角。\r\n- 真实摄影物件自然融合，统一光影和透视。\r\n- 小黑参与核心物理动作。\r\n- 2-4 个短中文手写标签。\r\n- 少量蓝 / 粉 / 黄 / 绿 / 红点缀。\r\n- 中等场景覆盖面积，但视觉重量轻。\r\n- 禁止截图、UI、Logo、PPT、商业插画、贴图边界和大段解释。\r\n\r\n完成标记：每张标准图都有独立提示词，且包含比例、背景、真实物件、小黑动作、标签、点缀和负面约束。\r\n\r\n### 3B. 彩蛋长卷生成\r\n\r\n当用户说“彩蛋模式 / 长卷故事图 / 超横版 / 个人经历 / 项目复盘 / 产品演化 / 成长路径 / 像这张长图”时，使用彩蛋模式。\r\n\r\n彩蛋模式的母版是 `assets/examples/07-long-scroll-story-master.png`，核心是：\r\n\r\n- 超横版长卷，比例接近 `2.6:1` 到 `3:1`。\r\n- 高级近白背景，接近白色但保留极轻摄影棚空气感；不要死白导致物件漂浮。\r\n- 一条细黑色手绘弯曲路线贯穿全图。\r\n- 5-8 个真实物件节点，每个节点有小黑参与动作。\r\n- 节点沿路线形成自然、不规律的上下起伏，不能紧凑平铺成一条水平流程，也不能做成规律正弦波。\r\n- 节点之间要有明显留白且不等距，视觉重心左右平衡，不能让大物件集中或压住画面。\r\n- 路线节奏要像手画出来：平缓段、突然抬高、浅弯、较深下探和安静收尾可以混合出现；避免机械的高低交替。\r\n- 左侧是起点身份/开场，右侧是现在关注/结论。\r\n- 节点文字贴近物件，像直接写在空白里的手写人生注释，不是信息图模块。\r\n- 节点文案默认不要放在便利贴、纸条、卡片或标签框里；彩色胶带、小圆点和短下划线只做点缀。\r\n- 节点不用序号、编号圆点或步骤标记；靠路线、物件和短标签自然串联。\r\n- 彩色胶带、小圆点、短下划线只做节奏点缀。\r\n\r\n彩蛋模式要保留母版的空间结构和叙事方式，但根据当前内容替换节点主题、真实物件、小黑动作、节点文案、起点和终点表达。不要复刻 Ian 个人经历、Dribbble、Muzli、Twitter/X、IBC 等具体内容，除非用户明确就是要做 Ian 自我介绍。\r\n\r\n完成标记：长卷提示词包含超横版比例、高级近白背景、曲线路径、5-8 个真实物件节点、小黑逐段参与、左起右收、无序号节点和事实锚定后的节点文案。\r\n\r\n### 4. 使用模板母版\r\n\r\n`assets/examples/` 是高质量模板母版，不是死板模板，也不是物件排除规则。\r\n\r\n出图必须对齐这些优秀标准：\r\n\r\n- 场景覆盖面积。\r\n- 留白和空气感。\r\n- 真实物件光影。\r\n- 小黑和物件的比例关系。\r\n- 短标签数量。\r\n- 点缀色密度。\r\n- 动作类型，例如左右拉扯、中心审查、物件涌出、标签重命名、筛选过滤。\r\n- 叙事关系，例如“被拉进去”“挡不住”“被审查”“被重命名”“被筛掉”。\r\n\r\n当当前文章和某张母版的动作类型高度匹配时，应当使用它作为质量锚点，抽取动作不变量，再为当前内容写出至少 3 个变异点。模板的价值是帮助判断“这种内容适合什么物理关系”，不是提供可描摹布局。\r\n\r\n真正要避免的是机械套模板：不看当前内容，直接照抄旧案例的物件组合、摆放关系、小黑动作和标签结构。每次都要让当前文章重新决定隐喻，至少重写标签语境，并根据内容调整动作、关系、角度或物件细节。\r\n\r\n彩蛋模式只有一个核心母版：`07-long-scroll-story-master.png`。它的价值不是具体物件，而是“真实物件人生线”的骨架：左起点、曲线路径、节点起伏、真实物件承载记忆点、小黑逐段参与、右侧收束。做新的长卷时，必须锁住这个骨架，再替换内容。\r\n\r\n完成标记：已说明使用哪张母版的空间关系，并明确哪些物件、动作、标签来自当前内容。\r\n\r\n### 5. QA 和迭代\r\n\r\n生成后按 `references/qa-checklist.md` 检查。重点看：\r\n\r\n- 候选图是否真的对齐了所选母版，而不只是包含相似元素。\r\n- 候选图是否过度复制了所选母版的空间拓扑、道具组合和小黑动作。\r\n- 候选图是否 3 秒读懂；如果需要解释主题才懂，就是失败。\r\n- 真实物件有没有截图感或贴图边界。\r\n- 场景有没有过大、过小、过满或过散。\r\n- 小黑是否承担核心动作。\r\n- 中文短标签是否准确、少、能读。\r\n- 有没有把模板母版机械套用，而不是根据当前内容重新适配。\r\n- 第一眼是否像“真实物件小现场”，而不是教程页、信息图或素材拼贴。\r\n- 彩蛋模式是否形成一条连续的真实物件人生线：左侧起点、曲线路径、节点起伏、小黑逐段参与、右侧收束。\r\n\r\n第一张生成图永远只是候选图，不是交付图。必须先查看候选图，并和所选母版做视觉比对。只要出现以下任何问题，就不交付，先重写提示词或重生成：\r\n\r\n- 元素清单化：把主题名词都堆进去，缺少一个清楚的物理冲突。\r\n- 母版复刻化：主体、方向、配件、小黑动作和标签位置像旧案例换字。\r\n- 读不懂：不看说明时，画面冲突不清楚。\r\n- 主物件过大或靠边，像商品图。\r\n- 物件太多，像素材拼贴。\r\n- 文字标签变成概念说明或标题。\r\n- 小黑没有承担母版级的物理动作。\r\n- 画面第一眼不像 `assets/examples/` 的正文配图质量。\r\n\r\n不合格就重生成或局部编辑，不要把低质量图展示为最终交付。可以向用户说明“候选图未过 QA，正在重做”，但不要把它包装成效果展示。\r\n\r\n完成标记：已通过 CRITICAL 项；未过 STANDARD 项时，交付状态标为 DONE_WITH_CONCERNS 并指出下一轮迭代方向。\r\n\r\n### 6. 保存交付\r\n\r\n如果用户在 workspace 内工作，把最终图复制到：\r\n\r\n```text\r\nassets/-xiaohei-scenes/\r\n```\r\n\r\n彩蛋长卷模式可以保存到：\r\n\r\n```text\r\nassets/-xiaohei-long-scroll/\r\n```\r\n\r\n按顺序命名：\r\n\r\n```text\r\n01-topic-name.png\r\n02-topic-name.png\r\n```\r\n\r\n保留原始生成文件，不覆盖已有资产，除非用户明确要求替换。\r\n\r\n完成标记：图片已展示或保存到目标目录，命名有序，未覆盖旧资产。\r\n\r\n## 输出口径\r\n\r\n生成前：短而准，给 shot list 或生成计划。\r\n\r\n生成后：展示图片、说明用途、给保存路径，并标出哪些最稳、哪些可选或需要再收一轮。\r\n\r\n不要长篇解释理论。让图先说话。\r\n\r\n## Completion States\r\n\r\n| 状态 | 含义 |\r\n| --- | --- |\r\n| DONE | 已完成 shot list 或图片生成，并按 QA 检查通过 |\r\n| DONE_WITH_CONCERNS | 已交付，但存在文字稳定性、物件真实感、背景纯度/近白空气感等待优化项 |\r\n| BLOCKED | 缺少主题/正文/节点，或用户要求的事实、人物、品牌信息不可确认 |\r\n\r\n## Quality Gates\r\n\r\n### Gate 1：CRITICAL（不过 = 不交付为最终图）\r\n\r\n- 标准模式必须有母版锁定记录；彩蛋模式必须锁定 07 长卷母版。\r\n- 标准模式必须有至少 3 个当前内容变异点，不能是旧母版换字版。\r\n- 小黑必须出现，并承担核心物理动作。\r\n- 真实物件必须像同一白色摄影棚里的真实小现场，不能是截图拼贴。\r\n- 标准模式必须是 16:9 正文图；彩蛋模式必须是超横版长卷图。\r\n- 标准模式背景必须接近 `#FFFFFF`；彩蛋模式背景必须是干净高级近白。\r\n- 中文标签必须短、少、可读，不能是假中文或大段解释。\r\n- 不得出现元素清单化：把主题里的多个名词、多个物件、多个标签都堆在一张图里。\r\n- 不得出现母版复刻化：把案例里的物件、方位、配件和小黑姿态原样换文字。\r\n- 画面必须 3 秒读懂；如果必须靠交付说明解释隐喻，不能交付为最终图。\r\n- 不得加入用户未提供或未授权的人名、联系方式、公司名、Logo、隐私信息。\r\n\r\n### Gate 2：STANDARD（不过 = 标注后可继续迭代）\r\n\r\n- 画面比例、留白、场景覆盖面积对齐母版。\r\n- 小黑形体稳定，不像表情包、吉祥物或儿童卡通。\r\n- 真实物件不压画面，节点之间有空气。\r\n- 彩色点缀只做节奏，不抢主体。\r\n- 输出能说明“哪张最稳、哪张需要再收一轮”。\r\n\r\n## Good vs Bad\r\n\r\n**好的：**\r\n\r\n> 一个真实主物件 + 一个小黑动作 + 2-4 个短标签。读者先看到真实小现场，再读懂处境。\r\n\r\n**差的：**\r\n\r\n> 把观点做成 PPT 流程图，堆很多箭头、模块框、大标题和解释文字，小黑只是站在旁边。\r\n\r\n**差在哪：**前者靠物理动作和真实物件讲故事；后者靠信息堆叠解释概念。\r\n\r\n## Suppressions\r\n\r\n- 用户明确提供的个人经历、品牌名、项目名，不算“未授权个人信息”，但不要额外发明。\r\n- 母版里的具体物件可以在内容匹配时复用，不算机械复刻；机械复刻指不看当前内容直接照搬旧图。\r\n- 生图模型偶发的轻微文字不稳不等于 Skill 失败，但必须在交付时标注并建议迭代。", "last_role": "assistant", "files": [], "msg_count": 2, "ideas": [], "workspace": "其他", "summary": "Base di st": "我想要搭建一个全新的公众号账号，和AI沟通的一些内容供你参阅，你阅读完后，思考使用什么样的技能，客观分析、研究、深入洞察，给出意见\r\n\r\n锚点只有一句「生命是时时刻刻不知如何是好」。我抛开文风和铁律，从这句本身重推账号物种和公众号形式。\r\n\r\n锚点只有这一句。下面从句子本身长出「账号是什么」和「公众号长什么样」。\r\n\r\n你说得对。我把「已有 DNA」抬成了硬约束，偏了。\r\n\r\n**唯一锚点只有这句：生命是时时刻刻不知如何是好。**  \r\n不是因为文风，是因为人们确实活在这个状态里。问题变成两层：\r\n\r\n1. **账号是什么**（存在方式）  \r\n2. **公众号长什么样**（形式差——赛道默认是「长文 + 痛点 + 洞察 + 安慰/方案」，不长成这样才叫差异化）\r\n\r\n---\r\n\r\n## 先拆这句，再长账号\r\n\r\n| 词 | 它在说什么 | 对账号的暗示 |\r\n|----|-----------|-------------|\r\n| **生命** | 不是情绪管理题，是活着本身 | 处理的是「人在过活」，不是「人要修好」 |\r\n| **是** | 判断句，陈述事实 | 可以做确认/记录/播报，不必先预设「解决」 |\r\n| **时时刻刻** | 连续、日常、非高潮 | 形式该像进行时、切片、高频，不像偶尔一篇大彻大悟 |\r\n| **不知如何是好** | 没有正确下一步；不是懒，是没地图 | 这是默认天气，不是待消灭的病症 |\r\n\r\n赛道里几乎所有号都把「不知如何是好」当成 **bug**：识别 → 解释 → 消除。  \r\n你的句子若是 **宪法**，账号的第一原则应是：\r\n\r\n> **这不是病。这是生命的常态。我们围绕这个常态，建一种别人没建过的东西。**\r\n\r\n「给不给方案」不再是铁律，只是后选参数。可以给，可以不给，可以有时给——取决于这个物种需要什么。\r\n\r\n---\r\n\r\n## 五个从这句长出来的「物种」\r\n\r\n每个都含：**存在方式 + 公众号形式 + 为何像这句 + 一篇长什么样**。\r\n\r\n---\r\n\r\n### W · 人类状态气象台（形式差最大）\r\n\r\n**账号是什么**  \r\n不治情绪，只发布「人类状态天气预报」。  \r\n「不知如何是好」= 一种气压/天气，天天有，可观测，可分级，不可消灭。\r\n\r\n**公众号长什么样（关键）**  \r\n不像文章号，像 **气象发布厅**：\r\n\r\n- 主更新：短预报体（300–600 字），不是 3000 字长文  \r\n- 结构固定：`现象 | 强度 | 影响区域 | 持续时间 | 不宜事项`（不宜事项可以是玩笑，也可以是真的）  \r\n- 可加「橙色预警」「今日卫星云图」（一张图/一个场景）  \r\n- 长文降级为「月度气候回顾」，不是日常主食\r\n\r\n**标题怎么用这句**  \r\n不必每篇都当前缀。可以是台名/栏花：\r\n\r\n> 生命气象台 · 7.27  \r\n> 今日主天气：不知如何是好（中到重度）  \r\n> 影响：打开待办又合上；已读不回自己的消息\r\n\r\n**读者关系**  \r\n```\r\n旧：病人 → 医生\r\n新：一城居民 → 气象台（看完预报，该上班上班）\r\n```\r\n\r\n**为何「还能这样」**  \r\n情感号几乎没人用 **预报产品形态**。打开公号不是「读一篇道理」，是「看今天的天气」。  \r\n「时时刻刻」被形式吃掉了：气象台本来就得持续发布。\r\n\r\n**可给方案吗**  \r\n可给「携带物建议」（带伞=今天别做重大决定），是服务不是治愈；也可以只预报不建议。\r\n\r\n---\r\n\r\n### X · 「不知如何是好」词条馆（引擎最硬）\r\n\r\n**账号是什么**  \r\n一部只收一种状态的辞典：所有词条都是「不知如何是好」在具体生活里的 **精确变体**。  \r\n账号不解决状态，只把状态 **命名到刺痛为止**。\r\n\r\n**公众号长什么样**  \r\n像 **在线辞典 / 词条站**，不像心灵鸡汤号：\r\n\r\n- 每篇一个词条：`【词条】开会时突然不知道自己是谁`  \r\n- 固定栏：释义 / 常见误诊（被说成懒、矫情、抑郁）/ 出现场景 / 近义条 / 反义条（假装知道如何是好）  \r\n- 可检索、可系列化、可做成「词条周历」  \r\n- 排版像字典：词头大、释义冷、例证活\r\n\r\n**和这句的关系**  \r\n总书名就是这句。每篇文章是这句的 **下位词**。  \r\n读者转发时截的是词条名——「这说的就是我」——身份标签极强。\r\n\r\n**一篇长什么样（示意）**\r\n\r\n```text\r\n【词条】升职消息发出后的空\r\n释义：外部情节已达高潮，内部情节尚未开拍时的空白带。\r\n误诊：不知足；高处不胜寒；该庆祝却不会。\r\n现场：点赞在跳，胃没有。\r\n近义：好事落地后的失重；朋友圈与身体的时差。\r\n参见：不知如何是好 · 总则\r\n```\r\n\r\n**为何「还能这样」**  \r\n产品是 **辞典**，不是专栏作家。赛道里有鸡汤体、咨询体、故事体，几乎没有「以命名精度为唯一产品」的公号形态。\r\n\r\n**可给方案吗**  \r\n词条可以附「无效药方」（试过没用的）和「中性备注」；也可以纯释义。由你选。\r\n\r\n---\r\n\r\n### Y · 此刻切片站（最贴「时时刻刻」）\r\n\r\n**账号是什么**  \r\n一台 CT：不拍人生全片，只切 **某一个此刻** 的横截面。  \r\n每一刀都是「这一刻，不知如何是好」的冻龄标本。\r\n\r\n**公众号长什么样**  \r\n像 **影像科/标本册**，不像长篇随笔：\r\n\r\n- 极短主形态：1 个切片 = 1 个瞬间（800 字内），可一日多更或组图  \r\n- 结构：`时间戳 | 身体 | 环境声 | 未完成的动作 | 切片备注`  \r\n- 可做成「24 小时不知如何是好」连载、地铁时刻表式目录  \r\n- 偶尔一篇「厚切片」= 传统长文，但是例外\r\n\r\n**标题**  \r\n`生命是时时刻刻不知如何是好——切片 03:17 冰箱门还开着`\r\n\r\n**读者关系**  \r\n```\r\n旧：听故事的人 → 说书人\r\n新：对片的人 → 切片技师（「你也有过这层截面」）\r\n```\r\n\r\n**为何「还能这样」**  \r\n公号默认追「完整叙事+升华」。你追 **横截面**，和短视频的「瞬间」抢同一神经，但留在图文里，形成形态差。  \r\n「时时刻刻」不是口号，是更新哲学。\r\n\r\n---\r\n\r\n### Z · 无图区广播（最像「生命」尺度）\r\n\r\n**账号是什么**  \r\n专门覆盖地图上不标路的区域：人生里那些 **没有攻略、没有正确下一步** 的地带。  \r\n「不知如何是好」= 坐标，不是情绪。\r\n\r\n**公众号长什么样**  \r\n像 **短波电台/航行通告**，不像导师号：\r\n\r\n- 文体：广播稿、波段报告、航行日志  \r\n- 栏目：`今日无图区 | 有人呼叫 | 误标航道清理 | 深夜通播`  \r\n- 允许读者来「呼叫」（留言被改成电文进下一期）  \r\n- 视觉：频率、坐标、信号格，而不是暖色插画\r\n\r\n**一句台呼**  \r\n> 你现在所在的位置，地图上是空白。这里是无图区广播。\r\n\r\n**为何「还能这样」**  \r\n存在方式是 **基础设施**（电台），不是人格导师。  \r\n差异化在「我是频道」，不在「我是某个温暖的人」。\r\n\r\n**可给方案吗**  \r\n可以给「附近已知等高线」（别人在类似坐标的记录），不是「你该往哪走」。也可以播报完就静音。\r\n\r\n---\r\n\r\n### Ω · 状态公证处（最贴句里的「是」）\r\n\r\n**账号是什么**  \r\n公证处：只对「你现在就是不知如何是好」做 **有效确认**，出具带编号的确认书。  \r\n不证明你有病，不证明你会好，只证明：**此状态属实。**\r\n\r\n**公众号长什么样**  \r\n像 **政务/文书窗口**，不像情感号（这是形式杀伤力来源）：\r\n\r\n- 主产品：确认书体 / 回执体  \r\n- 结构：`当事人陈述 | 在场证据 | 公证词 | 编号 | 无后续义务说明`  \r\n- 互动可以是「申请公证」（读者投稿状态 → 下期出具）  \r\n- 严肃版式 + 一个很人间的细节，形成反差\r\n\r\n**公证词示例**  \r\n> 兹证明：截至本文发布时，当事人所处「不知如何是好」之状态，与人类生命之常见情形相符。特此说明。本处不开具治疗意见。\r\n\r\n**为何「还能这样」**  \r\n整句里的 **「是」** 被做成机构职能：确认存在。  \r\n读者要的往往不是办法，是 **「我这样，算数」**。公号里几乎没人把「公证」当主产品。\r\n\r\n**可给方案吗**  \r\n默认不给。若给，必须另开窗口叫「非公证业务」，和主产品物理隔离——形式本身在说话。\r\n\r\n---\r\n\r\n## 对照：谁真的「围绕这句」，谁只是「标题党」\r\n\r\n| | 是否把这句当宪法 | 公众号形式是否跳出长文安慰 | 「时时刻刻」有没有被形式吃掉 | 差异化直觉 |\r\n|--|----------------|---------------------------|------------------------------|-----------|\r\n| **W 气象台** | 天气=这句 | 预报体，强 | 强（持续发布） | ★★★★★ |\r\n| **X 词条馆** | 总书名=这句 | 辞典体，强 | 中（词条可日更） | ★★★★★ |\r\n| **Y 切片站** | 每一刀=这句 | CT体，强 | 最强 | ★★★★☆ |\r\n| **Z 无图区广播** | 坐标=这句 | 电台体，强 | 中 | ★★★★☆ |\r\n| **Ω 公证处** | 「是」=职能 | 文书体，强 | 中 | ★★★★☆ |\r\n| 上轮 A 鉴定中心 | 可借用标题 | 仍偏长文报告 | 弱 | ★★★（可降为 W/Ω 下的栏目） |\r\n\r\n上一轮的鉴定/档案/翻译，可以变成这些物种 **底下的栏目**，但不再是账号本体——因为它们没强制要求「公众号形式」先换物种。\r\n\r\n---\r\n\r\n## 我的判断（可推翻）\r\n\r\n若目标是：**围绕这句 + 做出别人一眼看出不一样的公众号**——\r\n\r\n| 优先级 | 物种 | 理由 |\r\n|-------|------|------|\r\n| 1 | **W 气象台** 或 **X 词条馆** | W 形式差最大；X 选题引擎最硬、最好系列化爆款 |\r\n| 2 | **Ω 公证处** | 和「是」同构，互动（申请公证）天然适合公号 |\r\n| 3 | Y / Z | Y 极适合短内容矩阵；Z 适合做成「频道感」强品牌 |\r\n\r\n务实组合（一个号，不精神分裂）：\r\n\r\n```text\r\n台名宪法：生命是时时刻刻不知如何是好\r\n\r\n对外物种：人类状态气象台（W）\r\n├── 日更：天气预报（主形态，短）\r\n├── 周更：词条一条（X，命名深度）\r\n├── 互  动：状态公证（Ω，读者投稿出具）\r\n└── 偶  尔：无图区通播 / 厚切片（Z/Y）\r\n```\r\n\r\n读者第一眼是：**这是个气象台，不是又一个心理老师。**  \r\n宪法句可以是台训，印在菜单栏、年终片、每一篇页脚——而不是机械前缀。</user_query>", "last_role": "assistant", "files": [{"path": "G:\\workbuddy\\公众号SOP\\.workbuddy\\memory\\2026-07-27.md", "note": ".workbuddy\\memory\\2026-07-27.md", "kind": "新增", "name": "2026-07-27.md", "category": "原创文章"}], "msg_count": 16, "ideas": [], "workspace": "公众号SOP", "summary": "我想要搭建一个全新的公众号账号，和AI沟通的一些内容供你参阅，你阅读完后，思考使用什么样的技能，客观分析、研究、深入洞察，给出意见 锚点只有一句「生命是时时刻刻不知如何是好」。我抛开文风和铁律，从这句本身重推账号物种和公众号形式。 锚点只有这一句。下面从句子本身长出「账号是什么」", "status": "已完成", "ref_date": "2026-07-27", "ref_dt": "2026-07-27 02:35"}, {"id": "3e63b535-ef9e-432f-a5f7-909eb1a1dc0d", "project": "g-workbuddy-2026-07-26-21-42-47", "cwd": "g:\\workbuddy\\2026-07-26-21-42-47", "title": "帮我看下现在使用的大模型，是内置的mimo，还是opencode的mim", "first_request": "帮我看下现在使用的大模型，是内置的mimo，还是opencode的mimo</user_query>", "last_role": "assistant", "files": [], "msg_count": 4, "ideas": [], "workspace": "其他", "summary": "帮我看下现在使用的大模型，是内置 择、场景类型、原创隐喻和反复刻规则。\r\n- `references/master-selection.md`：标准模式 01-06 母版选择、质量锚点、变异要求和出图拦截规则。\r\n- `references/prompt-template.md`：单张生图提示词模板。\r\n- `references/qa-checklist.md`：生成后质量检查、失败信号和迭代方向。\r\n- `assets/examples/`：高质量模板母版和出图质量标尺。`01-06` 是标准 16:9 质量锚点；`07-long-scroll-story-master.png` 是彩蛋长卷模式唯一核心母版。标准图必须对齐它们的比例、留白、物件真实感、小黑气质、短标签密度、点缀色节奏和动作清晰度；不要复刻物件组合、空间拓扑、小黑姿态或标签位置。\r\n\r\n开始前确认：\r\n\r\n- 用户是否明确要标准 16:9 正文图，还是彩蛋长卷故事图。\r\n- 用户是否提供了必须保留的人名、品牌名、项目名或经历节点。\r\n- 如果没有明确要求生成图片，只先输出 shot list 或配图方案。\r\n- 如果用户要求“看效果 / 输出 / 生成”，标准模式必须先选择 01-06 中最匹配的母版；彩蛋模式必须锁定 07。没有母版锁定，不进入生图。\r\n- 如果对话上下文里没有刚刚看过对应母版，生成前必须查看所选母版图；生成后必须查看候选图再交付。\r\n\r\n## Core Flow\r\n\r\n### 1. 消化内容\r\n\r\n先提炼当前内容里的“处境”，不要急着找物件：\r\n\r\n- 这张图要让谁产生共鸣？\r\n- 他们正在被什么东西拉扯、筛选、压住、拽回、催促、重组？\r\n- 抽象概念能变成什么物理动作？\r\n- 哪 2-4 个短词能一秒戳中痛点？\r\n- 哪个真实物件天然承载这个处境？\r\n\r\n优先选择高共鸣节点：会议、消息、返工、审查、筛选、加码、被替代、下班失败、项目卡住、内容资产沉淀、产品演化断点。\r\n\r\n如果用户要求彩蛋模式，先把内容拆成 5-8 个连续节点：\r\n\r\n- 左侧起点：身份、起点、最初处境。\r\n- 中间节点：关键经历、项目转折、内容资产、产品演化。\r\n- 右侧终点：现在在做什么、核心关注、结论或下一阶段。\r\n- 每个节点都要有一个真实物件、小黑动作和 1-3 行短注释。\r\n\r\n完成标记：已经明确读者处境、核心冲突、真实物件、小黑动作和短中文标签；彩蛋模式已经得到 5-8 个可视化节点。\r\n\r\n### 1B. 事实锚定\r\n\r\n涉及个人经历、品牌名、公司名、项目名、粉丝数、时间跨度、成绩数字时，只能使用用户输入、用户提供素材或用户明确确认的事实。\r\n\r\n- 用户没有提供的事实，不要从母版继承，也不要补成看起来更完整的履历。\r\n- 无法确认的内容，用概括性标签替代，例如“内容平台”“项目节点”“用户反馈”“产品实验”。\r\n- 如果用户要求保留但信息不完整，在 shot list 或交付说明里标注“待确认”，不要把它画成确定事实。\r\n\r\n完成标记：所有具体事实都能回到用户输入或素材；不能回溯的事实已删除、抽象化或标注待确认。\r\n\r\n### 2. 先出 shot list\r\n\r\n如果用户说“分析 / 思考 / 怎么配图”，先给 shot list。每张写清：\r\n\r\n- 使用哪张母版\r\n- 图的主题\r\n- 读者共鸣点\r\n- 物理动作\r\n- 真实主物件\r\n- 小黑在做什么\r\n- 中文短标签\r\n- 为什么这张值得画\r\n\r\n标准模式默认 4-8 张。彩蛋模式默认先出 1 张长卷母版效果图。用户明确要“看效果 / 输出 / 生成”时，直接生图，不要停在方案，但仍必须先在内部完成 2B 母版锁定。\r\n\r\n完成标记：每个候选画面都有母版、主题、共鸣点、物理动作、真实主物件、小黑动作、短标签和成图理由。\r\n\r\n### 2B. 母版锁定（标准模式强制）\r\n\r\n标准模式每张图在生成前必须先完成母版锁定。读取 `references/master-selection.md`，从 `01-06` 里选一张最匹配的质量锚点。母版不是可复制构图；不要把案例的手机、纸条、沙漏、电脑、放大镜等空间拓扑直接搬过来。\r\n\r\n必填字段：\r\n\r\n```text\r\n母版：\r\n抽取的不变量：\r\n当前内容的变异点：\r\n画面 3 秒读懂句：\r\n当前内容适配：\r\n要避免的失败信号：\r\n```\r\n\r\n选择原则：\r\n\r\n- 下班失败、报警、返工回流、问题打结：优先 `03-production-alert`。\r\n- 消息涌出、任务过载：优先 `02-message-overload`。\r\n- 会议 / 同步 / 对齐把人拉回：优先 `01-meeting-pull-in`。\r\n- 审查 / 校对 / 兜底 / 返工检查：优先 `04-code-review-rework`。\r\n- AI 自动化、岗位重组、身份标签变化：优先 `05-ai-automation-badge`。\r\n- 筛选 / 过滤 / 关键词 / 机会流失：优先 `06-ai-resume-filter`。\r\n\r\n如果当前内容不完全匹配任何母版，也要选择最接近的一张作为比例、留白和信息密度标尺，然后重写物件、动作和标签。\r\n\r\n变异要求：\r\n\r\n- 至少 3 项和母版不同：主物件类别、空间方向、小黑动作、道具组合、标签位置、视角或叙事重心。\r\n- 如果主物件和母版相同，空间关系和小黑动作必须明显不同。\r\n- 如果空间关系和母版相近，主物件、动作和配件必须明显不同。\r\n- 不能把母版案例做成换字版。第一眼像旧案例换主题，即失败。\r\n\r\n硬性预算：\r\n\r\n- 只能有一个核心物理动作。\r\n- 只能有一个真实主物件或紧凑主物件组。\r\n- 最多 1-2 个小配件。\r\n- 最多 4 个短标签，优先 3 个。\r\n- 禁止把主题里的所有名词都画出来。出现“元素清单化”时，先删减再生成。\r\n- 单个深色大物件不能支配画面；手机、电脑、黑色盒子等深色主物件要缩小或换成更轻的实物锚点。\r\n- 整体场景要比母版更轻或同等轻，不能更满、更大、更重。\r\n\r\n完成标记：每张标准图都有明确母版、不变量、至少 3 个变异点、3 秒读懂句、适配点和失败信号；没有元素清单化或母版复刻化。\r\n\r\n### 3. 单张生成\r\n\r\n每张图单独生成，不要把多张拼成一张。\r\n\r\n默认用 16:9 横版。提示词必须包含：\r\n\r\n- 母版锁定：使用哪张 01-06 案例作为质量锚点，抽取哪些不变量，当前图如何做至少 3 个变异。\r\n- `#FFFFFF` 纯白背景和白色摄影棚表面，不能是灰白、暖白、米白、渐变或暗角。\r\n- 真实摄影物件自然融合，统一光影和透视。\r\n- 小黑参与核心物理动作。\r\n- 2-4 个短中文手写标签。\r\n- 少量蓝 / 粉 / 黄 / 绿 / 红点缀。\r\n- 中等场景覆盖面积，但视觉重量轻。\r\n- 禁止截图、UI、Logo、PPT、商业插画、贴图边界和大段解释。\r\n\r\n完成标记：每张标准图都有独立提示词，且包含比例、背景、真实物件、小黑动作、标签、点缀和负面约束。\r\n\r\n### 3B. 彩蛋长卷生成\r\n\r\n当用户说“彩蛋模式 / 长卷故事图 / 超横版 / 个人经历 / 项目复盘 / 产品演化 / 成长路径 / 像这张长图”时，使用彩蛋模式。\r\n\r\n彩蛋模式的母版是 `assets/examples/07-long-scroll-story-master.png`，核心是：\r\n\r\n- 超横版长卷，比例接近 `2.6:1` 到 `3:1`。\r\n- 高级近白背景，接近白色但保留极轻摄影棚空气感；不要死白导致物件漂浮。\r\n- 一条细黑色手绘弯曲路线贯穿全图。\r\n- 5-8 个真实物件节点，每个节点有小黑参与动作。\r\n- 节点沿路线形成自然、不规律的上下起伏，不能紧凑平铺成一条水平流程，也不能做成规律正弦波。\r\n- 节点之间要有明显留白且不等距，视觉重心左右平衡，不能让大物件集中或压住画面。\r\n- 路线节奏要像手画出来：平缓段、突然抬高、浅弯、较深下探和安静收尾可以混合出现；避免机械的高低交替。\r\n- 左侧是起点身份/开场，右侧是现在关注/结论。\r\n- 节点文字贴近物件，像直接写在空白里的手写人生注释，不是信息图模块。\r\n- 节点文案默认不要放在便利贴、纸条、卡片或标签框里；彩色胶带、小圆点和短下划线只做点缀。\r\n- 节点不用序号、编号圆点或步骤标记；靠路线、物件和短标签自然串联。\r\n- 彩色胶带、小圆点、短下划线只做节奏点缀。\r\n\r\n彩蛋模式要保留母版的空间结构和叙事方式，但根据当前内容替换节点主题、真实物件、小黑动作、节点文案、起点和终点表达。不要复刻 Ian 个人经历、Dribbble、Muzli、Twitter/X、IBC 等具体内容，除非用户明确就是要做 Ian 自我介绍。\r\n\r\n完成标记：长卷提示词包含超横版比例、高级近白背景、曲线路径、5-8 个真实物件节点、小黑逐段参与、左起右收、无序号节点和事实锚定后的节点文案。\r\n\r\n### 4. 使用模板母版\r\n\r\n`assets/examples/` 是高质量模板母版，不是死板模板，也不是物件排除规则。\r\n\r\n出图必须对齐这些优秀标准：\r\n\r\n- 场景覆盖面积。\r\n- 留白和空气感。\r\n- 真实物件光影。\r\n- 小黑和物件的比例关系。\r\n- 短标签数量。\r\n- 点缀色密度。\r\n- 动作类型，例如左右拉扯、中心审查、物件涌出、标签重命名、筛选过滤。\r\n- 叙事关系，例如“被拉进去”“挡不住”“被审查”“被重命名”“被筛掉”。\r\n\r\n当当前文章和某张母版的动作类型高度匹配时，应当使用它作为质量锚点，抽取动作不变量，再为当前内容写出至少 3 个变异点。模板的价值是帮助判断“这种内容适合什么物理关系”，不是提供可描摹布局。\r\n\r\n真正要避免的是机械套模板：不看当前内容，直接照抄旧案例的物件组合、摆放关系、小黑动作和标签结构。每次都要让当前文章重新决定隐喻，至少重写标签语境，并根据内容调整动作、关系、角度或物件细节。\r\n\r\n彩蛋模式只有一个核心母版：`07-long-scroll-story-master.png`。它的价值不是具体物件，而是“真实物件人生线”的骨架：左起点、曲线路径、节点起伏、真实物件承载记忆点、小黑逐段参与、右侧收束。做新的长卷时，必须锁住这个骨架，再替换内容。\r\n\r\n完成标记：已说明使用哪张母版的空间关系，并明确哪些物件、动作、标签来自当前内容。\r\n\r\n### 5. QA 和迭代\r\n\r\n生成后按 `references/qa-checklist.md` 检查。重点看：\r\n\r\n- 候选图是否真的对齐了所选母版，而不只是包含相似元素。\r\n- 候选图是否过度复制了所选母版的空间拓扑、道具组合和小黑动作。\r\n- 候选图是否 3 秒读懂；如果需要解释主题才懂，就是失败。\r\n- 真实物件有没有截图感或贴图边界。\r\n- 场景有没有过大、过小、过满或过散。\r\n- 小黑是否承担核心动作。\r\n- 中文短标签是否准确、少、能读。\r\n- 有没有把模板母版机械套用，而不是根据当前内容重新适配。\r\n- 第一眼是否像“真实物件小现场”，而不是教程页、信息图或素材拼贴。\r\n- 彩蛋模式是否形成一条连续的真实物件人生线：左侧起点、曲线路径、节点起伏、小黑逐段参与、右侧收束。\r\n\r\n第一张生成图永远只是候选图，不是交付图。必须先查看候选图，并和所选母版做视觉比对。只要出现以下任何问题，就不交付，先重写提示词或重生成：\r\n\r\n- 元素清单化：把主题名词都堆进去，缺少一个清楚的物理冲突。\r\n- 母版复刻化：主体、方向、配件、小黑动作和标签位置像旧案例换字。\r\n- 读不懂：不看说明时，画面冲突不清楚。\r\n- 主物件过大或靠边，像商品图。\r\n- 物件太多，像素材拼贴。\r\n- 文字标签变成概念说明或标题。\r\n- 小黑没有承担母版级的物理动作。\r\n- 画面第一眼不像 `assets/examples/` 的正文配图质量。\r\n\r\n不合格就重生成或局部编辑，不要把低质量图展示为最终交付。可以向用户说明“候选图未过 QA，正在重做”，但不要把它包装成效果展示。\r\n\r\n完成标记：已通过 CRITICAL 项；未过 STANDARD 项时，交付状态标为 DONE_WITH_CONCERNS 并指出下一轮迭代方向。\r\n\r\n### 6. 保存交付\r\n\r\n如果用户在 workspace 内工作，把最终图复制到：\r\n\r\n```text\r\nassets/-xiaohei-scenes/\r\n```\r\n\r\n彩蛋长卷模式可以保存到：\r\n\r\n```text\r\nassets/-xiaohei-long-scroll/\r\n```\r\n\r\n按顺序命名：\r\n\r\n```text\r\n01-topic-name.png\r\n02-topic-name.png\r\n```\r\n\r\n保留原始生成文件，不覆盖已有资产，除非用户明确要求替换。\r\n\r\n完成标记：图片已展示或保存到目标目录，命名有序，未覆盖旧资产。\r\n\r\n## 输出口径\r\n\r\n生成前：短而准，给 shot list 或生成计划。\r\n\r\n生成后：展示图片、说明用途、给保存路径，并标出哪些最稳、哪些可选或需要再收一轮。\r\n\r\n不要长篇解释理论。让图先说话。\r\n\r\n## Completion States\r\n\r\n| 7a1", "project": "g-workbuddy-2026-07-07-01-20-06", "cwd": "g:\\workbuddy\\2026-07-07-01-20-06", "title": "@\"H:/坚果云2026/山水聚/（7月17日12：00前报送市住建局）", "first_request": "@\"H:/坚果云2026/山水聚/（7月17日12：00前报送市住建局））XX项目2026年购房季活动策划方案模板.doc\" @\"H:/坚果云2026/山水聚/（7月17日12：00前报送市住建局））香颂山水聚项目2026年购房季活动策划方案.doc\" 阅读第一份文件，以其为模版，为香颂山水聚项目考虑并规划活动策划方案</user_query>", "last_role": "assistant", "files": [{"path": "H:/workbuddy/2026-07-07-01-20-06/_plan_zh.md", "note": "_plan_zh.md", "kind": "新增", "name": "_plan_zh.md", "category": "原创文章"}, {"path": "H:/workbuddy/2026-07-07-01-20-06/.workbuddy/memory/2026-07-07.md", "note": ".workbuddy\\memory\\2026-07-07.md", "kind": "新增", "name": "2026-07-07.md", "category": "原创文章"}, {"path": "H:/workbuddy/2026-07-07-01-20-06/_plan_v2.md", "note": "_plan_v2.md", "kind": "新增", "name": "_plan_v2.md", "category": "原创文章"}, {"path": "H:/workbuddy/2026-07-07-01-20-06/_plan_v3.md", "note": "_plan_v3.md", "kind": "新增", "name": "_plan_v3.md", "category": "原创文章"}], "msg_count": 23, "ideas": [], "workspace": "其他", "summary": "@\"H:/坚果云2026/山水聚/（7月17日12：00前报送市住建局））XX项目2026年购房季活动策划方案模板.doc\" @\"H:/坚果云2026/山水聚/（7月17日12：00前报送市住建局））香颂山水聚项目2026年购房季活动策划方案.doc\" 阅读第一份文件，以其为模版", "status": "已完成", "ref_date": "2026-07-07", "ref_dt": "2026-07-07 01:20"}, {"id": "ed8a91df-8c40-4b77-a7b4-a5f837ea0116", "project": "g-workbuddy-2026-06-19-02-37-22", "cwd": "g:\\workbuddy\\2026-06-19-02-37-22", "title": "@skill:ian-xiaohei-fluid 用下面内容生成图片# ", "first_request": "@skill:ian-xiaohei-fluid 用下面内容生成图片# 现在开始是不是太晚了？\n\n最近经常收到一类问题，翻来覆去就是一个意思：我现在才想要做某件事，是不是太晚了？\n\n发这种消息的人年龄跨度很大。二十岁的问现在学一门新技能是不是太晚了，三十岁的问现在换行业是不是太晚了，四十岁的问现在开始锻炼是不是太晚了，五十岁的问现在学一门乐器是不是太晚了。我有时候看着这些留言会想——他们期待的究竟是一个什么样的答案？\n\n如果说\"不晚\"，他们会不会就真的去做了？\n\n我猜不会。他们会继续等，等到下一个\"更合适\"的时机。说是问晚不晚，其实是在等一个许可。等有人告诉他们：你准备好了，去吧。\n\n---\n\n以前我并不这么想。以前我觉得人们是真的在寻求建议，是真的不确定时机是否合适。后来我发现不是那么回事。\n\nMark Manson 说他每天都能收到从二十岁到八十岁的人发来的邮件，内容一模一样——\"现在开始是不是太晚了？\"他说他见过一个最极端的例子：朋友的婆婆，六十二岁，丈夫去世后开始学钢琴。每天练，练了几十年。后来她演奏莫扎特、贝多芬、巴赫的时候，所有人都以为她从小就是钢琴家。\n\n六十二岁才开始。\n\n这中间有一个很微妙的错位。问\"是不是太晚了\"的人，普遍在三四十岁，身强力壮，精力充沛。而那个六十二岁才开始学琴的人，根本没问过这个问题——她直接就去了。\n\n---\n\n差别在哪里？差别在于问问题的人以为自己需要的答案是\"来得及\"还是\"来不及\"，但他们真正需要的是一种行动的能力。这种能力跟时间没有关系，跟年龄没有关系，甚至跟信心也没有关系。\n\n我自己有个体会。每次我拖了很久没写一篇文章，越拖就越觉得\"写不出来\"，状态不对，灵感没到，时机不好。终于有一天被逼得没办法坐在电脑前开始敲第一个字——十分钟之后，之前的那些障碍全部消失了。动作本身就能解决大部分问题，但你必须先做一个动作。\n\nMark Manson 有一句话说得很好：动力不是行动的原因，而是行动的结果。\n\n这话反直觉，因为大部分人把因果关系搞反了。大家认为要先有动力才能行动，但真实情况是——你先动起来，动力才会出现。就像你不可能等到\"准备好了\"才去跑步，你穿上鞋跑起来的那一刻，才是真正的准备。\n\n---\n\nMark Manson 自己二十七岁才开始写作。二十七岁，在今天的标准来看已经是\"大龄青年\"了。三十六岁才开始拍视频。他现在是全世界最畅销的作者之一，但你要知道，在那之前他写了很多年没人看的东西。\n\n人们很容易产生一种错觉——看到一个人做成了某件事，就觉得他一定是天赋异禀，从小就是这块料。但实际上，大部分人的真实轨迹是：开始得很晚，做得一般，坚持了很久，突然有一天发现好像还行。\n\n这不是什么励志故事，这只是统计学上的事实。因为大多数人在二十岁的时候根本不知道自己想要什么，三十岁也不一定知道。真正知道自己要什么的，是那些已经开始做了的人——他们做着做着就知道了。\n\n---\n\n我有一个可能不太讨人喜欢的看法。我觉得问\"是不是太晚了\"的人，心里清楚答案是什么。他们只是不想听那个答案。\n\n如果真的觉得太晚了，他们不会问。如果真的觉得不晚，他们也不会问。问了，说明他们处在中间地带——知道应该去做，又害怕做了之后证明自己不行。于是用一个问题来拖延，把责任外包给一个陌生人的回答。\n\n所以我现在的回复越来越短了。以前我会认真分析，讲道理，举例子。现在我通常就说一句：\n\n你觉得呢？\n\n---\n\n那句老话其实只说对了一半。种一棵树最好的时间是十年前，其次是现在。但这句话忽略了一个问题——那些十年前没种树的人，现在大概率也不会去种。他们会继续等，等到又一个十年过去，然后对自己说：你看，果然太晚了。\n\n所以真正的答案不是\"晚不晚\"，而是你愿不愿意接受一个事实：从现在开始的每一步，都比你站在原地问问题更接近你想要的东西。\n\n六十二岁开始弹钢琴的那位老太太，大概从来没想过自己会成为什么钢琴家。她就是每天练。练着练着，几十年过去了。她没有等一个\"合适的时间\"，因为她知道没有这种东西。\n\n你猜她是什么时候想通的？\n\n我猜就是她丈夫去世后的某一天。她也曾坐在那里想——现在开始是不是太晚了？然后她站起来，走向了钢琴。\n\n就这么简单。\n\n就这么难。</user_query>", "last_role": "assistant", "files": [{"path": "G:\\workbuddy\\2026-06-19-02-37-22\\assets\\is-it-too-late-xiaohei-fluid\\01-wen-hao-jie.png", "note": "为《现在开始是不是太晚了》生成流体小黑配图 2 张：01 主力图「问号结」（推荐），02 备选构图（同主题变体）。如需钢琴主题「第一键」需重新生成。", "kind": "交付", "name": "01-wen-hao-jie.png", "category": "其他产出"}, {"path": "G:\\workbuddy\\2026-06-19-02-37-22\\assets\\is-it-too-late-xiaohei-fluid\\02-piano-first-key.png", "note": "为《现在开始是不是太晚了》生成流体小黑配图 2 张：01 主力图「问号结」（推荐），02 备选构图（同主题变体）。如需钢琴主题「第一键」需重新生成。", "kind": "交付", "name": "02-piano-first-key.png", "category": "其他产出"}, {"path": "G:\\workbuddy\\2026-06-19-02-37-22\\.workbuddy\\memory\\2026-07-07.md", "note": ".workbuddy\\memory\\2026-07-07 "name": "README.md", "category": "原创文章"}], "msg_count": 75, "ideas": [], "workspace": "其他", "summary": "@skill:ian-xiaohei-scenes 随意生成两张图我看看效果</user_query>", "status": "已完成", "ref_date": "2026-07-06", "ref_dt": "2026-07-06 21:26"}, {"id": "agent-230d7064", "project": "subagents", "cwd": "", "title": "Base directory for this skill: C:\\Us", "first_request": "Base directory for this skill: C:\\Users\\godhu\\.workbuddy\\skills\\ian-xiaohei-scenes\n# Ian 小黑实物场景图\r\n\r\n## 核心定位\r\n\r\n把文章观点、用户处境、个人经历、项目过程、产品演化和内容资产，转译成一张可传播的“真实物件小现场”或“真实物件人生线”：\r\n\r\n```text\r\n小黑 + 真实物件 + 物理动作 + 短中文标签 + 留白叙事\r\n```\r\n\r\n这不是 1.0 的纯手绘解释图，也不是 PPT 信息图。2.0 的目标是让读者先看到一个真实、轻、怪的现场，再在 1 秒内意识到“这说的就是我”。\r\n\r\n本 Skill 有两种输出规格：\r\n\r\n- **标准模式**：16:9 正文配图，一个真实物件小现场，默认纯白 `#FFFFFF` 背景。\r\n- **彩蛋模式**：小黑长卷故事图，一条超横版真实物件人生线，用于个人经历、项目复盘、产品演化、成长路径和内容资产演进。它以 `assets/examples/07-long-scroll-story-master.png` 为核心母版，使用高级近白背景，不强制死白。\r\n\r\n## 和 1.0 的区别\r\n\r\n- 1.0：更像白板上的手绘逻辑图，适合拆文章、拆流程、拆方法。\r\n- 2.0：更像白色摄影棚里的真实物件现场，适合表达处境、情绪、项目故事、产品故事和正文观点隐喻。\r\n\r\n如果用户要求“纯手绘小黑解释图 / 白板风流程图 / 手绘方法论图”，优先用 `$ian-xiaohei-illustrations`。如果用户要求“真实物件 / 实物图 / 小黑 + 物件 / 打工人共鸣 / 更有生活质感 / 小黑 2.0”，用本 Skill。\r\n\r\n## Before Starting\r\n\r\n按任务需要读取，不要一次全部塞进上下文：\r\n\r\n- `references/style-dna.md`：2.0 视觉 DNA、比例、留白、颜色、真实物件规则。\r\n- `references/xiaohei-ip.md`：小黑 IP 在 2.0 里的形体弹性、动作和禁忌。\r\n- `references/story-extraction.md`：如何从正文里提炼用户处境、物理动作和短标签。\r\n- `references/object-patterns.md`：真实物件选择、场景类型、原创隐喻和反复刻规则。\r\n- `references/master-selection.md`：标准模式 01-06 母版选择、质量锚点、变异要求和出图拦截规则。\r\n- `references/prompt-template.md`：单张生图提示词模板。\r\n- `references/qa-checklist.md`：生成后质量检查、失败信号和迭代方向。\r\n- `assets/examples/`：高质量模板母版和出图质量标尺。`01-06` 是标准 16:9 质量锚点；`07-long-scroll-story-master.png` 是彩蛋长卷模式唯一核心母版。标准图必须对齐它们的比例、留白、物件真实感、小黑气质、短标签密度、点缀色节奏和动作清晰度；不要复刻物件组合、空间拓扑、小黑姿态或标签位置。\r\n\r\n开始前确认：\r\n\r\n- 用户是否明确要标准 16:9 正文图，还是彩蛋长卷故事图。\r\n- 用户是否提供了必须保留的人名、品牌名、项目名或经历节点。\r\n- 如果没有明确要求生成图片，只先输出 shot list 或配图方案。\r\n- 如果用户要求“看效果 / 输出 / 生成”，标准模式必须先选择 01-06 中最匹配的母版；彩蛋模式必须锁定 07。没有母版锁定，不进入生图。\r\n- 如果对话上下文里没有刚刚看过对应母版，生成前必须查看所选母版图；生成后必须查看候选图再交付。\r\n\r\n## Core Flow\r\n\r\n### 1. 消化内容\r\n\r\n先提炼当前内容里的“处境”，不要急着找物件：\r\n\r\n- 这张图要让谁产生共鸣？\r\n- 他们正在被什么东西拉扯、筛选、压住、拽回、催促、重组？\r\n- 抽象概念能变成什么物理动作？\r\n- 哪 2-4 个短词能一秒戳中痛点？\r\n- 哪个真实物件天然承载这个处境？\r\n\r\n优先选择高共鸣节点：会议、消息、返工、审查、筛选、加码、被替代、下班失败、项目卡住、内容资产沉淀、产品演化断点。\r\n\r\n如果用户要求彩蛋模式，先把内容拆成 5-8 个连续节点：\r\n\r\n- 左侧起点：身份、起点、最初处境。\r\n- 中间节点：关键经历、项目转折、内容资产、产品演化。\r\n- 右侧终点：现在在做什么、核心关注、结论或下一阶段。\r\n- 每个节点都要有一个真实物件、小黑动作和 1-3 行短注释。\r\n\r\n完成标记：已经明确读者处境、核心冲突、真实物件、小黑动作和短中文标签；彩蛋模式已经得到 5-8 个可视化节点。\r\n\r\n### 1B. 事实锚定\r\n\r\n涉及个人经历、品牌名、公司名、项目名、粉丝数、时间跨度、成绩数字时，只能使用用户输入、用户提供素材或用户明确确认的事实。\r\n\r\n- 用户没有提供的事实，不要从母版继承，也不要补成看起来更完整的履历。\r\n- 无法确认的内容，用概括性标签替代，例如“内容平台”“项目节点”“用户反馈”“产品实验”。\r\n- 如果用户要求保留但信息不完整，在 shot list 或交付说明里标注“待确认”，不要把它画成确定事实。\r\n\r\n完成标记：所有具体事实都能回到用户输入或素材；不能回溯的事实已删除、抽象化或标注待确认。\r\n\r\n### 2. 先出 shot list\r\n\r\n如果用户说“分析 / 思考 / 怎么配图”，先给 shot list。每张写清：\r\n\r\n- 使用哪张母版\r\n- 图的主题\r\n- 读者共鸣点\r\n- 物理动作\r\n- 真实主物件\r\n- 小黑在做什么\r\n- 中文短标签\r\n- 为什么这张值得画\r\n\r\n标准模式默认 4-8 张。彩蛋模式默认先出 1 张长卷母版效果图。用户明确要“看效果 / 输出 / 生成”时，直接生图，不要停在方案，但仍必须先在内部完成 2B 母版锁定。\r\n\r\n完成标记：每个候选画面都有母版、主题、共鸣点、物理动作、真实主物件、小黑动作、短标签和成图理由。\r\n\r\n### 2B. 母版锁定（标准模式强制）\r\n\r\n标准模式每张图在生成前必须先完成母版锁定。读取 `references/master-selection.md`，从 `01-06` 里选一张最匹配的质量锚点。母版不是可复制构图；不要把案例的手机、纸条、沙漏、电脑、放大镜等空间拓扑直接搬过来。\r\n\r\n必填字段：\r\n\r\n```text\r\n母版：\r\n抽取的不变量：\r\n当前内容的变异点：\r\n画面 3 秒读懂句：\r\n当前内容适配：\r\n要避免的失败信号：\r\n```\r\n\r\n选择原则：\r\n\r\n- 下班失败、报警、返工回流、问题打结：优先 `03-production-alert`。\r\n- 消息涌出、任务过载：优先 `02-message-overload`。\r\n- 会议 / 同步 / 对齐把人拉回：优先 `01-meeting-pull-in`。\r\n- 审查 / 校对 / 兜底 / 返工检查：优先 `04-code-review-rework`。\r\n- AI 自动化、岗位重组、身份标签变化：优先 `05-ai-automation-badge`。\r\n- 筛选 / 过滤 / 关键词 / 机会流失：优先 `06-ai-resume-filter`。\r\n\r\n如果当前内容不完全匹配任何母版，也要选择最接近的一张作为比例、留白和信息密度标尺，然后重写物件、动作和标签。\r\n\r\n变异要求：\r\n\r\n- 至少 3 项和母版不同：主物件类别、空间方向、小黑动作、道具组合、标签位置、视角或叙事重心。\r\n- 如果主物件和母版相同，空间关系和小黑动作必须明显不同。\r\n- 如果空间关系和母版相近，主物件、动作和配件必须明显不同。\r\n- 不能把母版案例做成换字版。第一眼像旧案例换主题，即失败。\r\n\r\n硬性预算：\r\n\r\n- 只能有一个核心物理动作。\r\n- 只能有一个真实主物件或紧凑主物件组。\r\n- 最多 1-2 个小配件。\r\n- 最多 4 个短标签，优先 3 个。\r\n- 禁止把主题里的所有名词都画出来。出现“元素清单化”时，先删减再生成。\r\n- 单个深色大物件不能支配画面；手机、电脑、黑色盒子等深色主物件要缩小或换成更轻的实物锚点。\r\n- 整体场景要比母版更轻或同等轻，不能更满、更大、更重。\r\n\r\n完成标记：每张标准图都有明确母版、不变量、至少 3 个变异点、3 秒读懂句、适配点和失败信号；没有元素清单化或母版复刻化。\r\n\r\n### 3. 单张生成\r\n\r\n每张图单独生成，不要把多张拼成一张。\r\n\r\n默认用 16:9 横版。提示词必须包含：\r\n\r\n- 母版锁定：使用哪张 01-06 案例作为质量锚点，抽取哪些不变量，当前图如何做至少 3 个变异。\r\n- `#FFFFFF` 纯白背景和白色摄影棚表面，不能是灰白、暖白、米白、渐变或暗角。\r\n- 真实摄影物件自然融合，统一光影和透视。\r\n- 小黑参与核心物理动作。\r\n- 2-4 个短中文手写标签。\r\n- 少量蓝 / 粉 / 黄 / 绿 / 红点缀。\r\n- 中等场景覆盖面积，但视觉重量轻。\r\n  - 禁止截图、UI、Logo、PPT、商业插画、贴图边界和大段解释。\r\n  - 纯白背景强制机制：提示词必须同时写入「正面强化」（seamless pure white background / overexposed white high-key lighting / #FFFFFF / crisp edges / minimal studio lighting）与「负面拒绝」（shadows / gradients / grey / dark corners / room interior / wall textures / depth of field / blur / camera noise / 3D render look）。本模型无原生 negative_prompt 参数，所有负面约束必须嵌入主提示词；如对背景纯度要求极高，可在生图工具中设 background=opaque 进一步兜底。\r\n\r\n完成标记：每张标准图都有独立提示词，且包含比例、背景、真实物件、小黑动作、标签、点缀和负面约束。\r\n\r\n### 3B. 彩蛋长卷生成\r\n\r\n当用户说“彩蛋模式 / 长卷故事图 / 超横版 / 个人经历 / 项目复盘 / 产品演化 / 成长路径 / 像这张长图”时，使用彩蛋模式。\r\n\r\n彩蛋模式的母版是 `assets/examples/07-long-scroll-story-master.png`，核心是：\r\n\r\n- 超横版长卷，比例接近 `2.6:1` 到 `3:1`。\r\n- 高级近白背景，接近白色但保留极轻摄影棚空气感；不要死白导致物件漂浮。\r\n- 一条细黑色手绘弯曲路线贯穿全图。\r\n- 5-8 个真实物件节点，每个节点有小黑参与动作。\r\n- 节点沿路线形成自然、不规律的上下起伏，不能紧凑平铺成一条水平流程，也不能做成规律正弦波。\r\n- 节点之间要有明显留白且不等距，视觉重心左右平衡，不能让大物件集中或压住画面。\r\n- 路线节奏要像手画出来：平缓段、突然抬高、浅弯、较深下探和安静收尾可以混合出现；避免机械的高低交替。\r\n- 左侧是起点身份/开场，右侧是现在关注/结论。\r\n- 节点文字贴近物件，像直接写在空白里的手写人生注释，不是信息图模块。\r\n- 节点文案默认不要放在便利贴、纸条、卡片或标签框里；彩色胶带、小圆点和短下划线只做点缀。\r\n- 节点不用序号、编号圆点或步骤标记；靠路线、物件和短标签自然串联。\r\n- 彩色胶带、小圆点、短下划线只做节奏点缀。\r\n\r\n彩蛋模式要保留母版的空间结构和叙事方式，但根据当前内容替换节点主题、真实物件、小黑动作、节点文案、起点和终点表达。不要复刻 Ian 个人经历、Dribbble、Muzli、Twitter/X、IBC 等具体内容，除非用户明确就是要做 Ian 自我介绍。\r\n\r\n完成标记：长卷提示词包含超横版比例、高级近白背景、曲线路径、5-8 个真实物件节点、小黑逐段参与、左起右收、无序号节点和事实锚定后的节点文案。\r\n\r\n### 4. 使用模板母版\r\n\r\n`assets/examples/` 是高质量模板母版，不是死板模板，也不是物件排除规则。\r\n\r\n出图必须对齐这些优秀标准：\r\n\r\n- 场景覆盖面积。\r\n- 留白和空气感。\r\n- 真实物件光影。\r\n- 小黑和物件的比例关系。\r\n- 短标签数量。\r\n- 点缀色密度。\r\n- 动作类型，例如左右拉扯、中心审查、物件涌出、标签重命名、筛选过滤。\r\n- 叙事关系，例如“被拉进去”“挡不住”“被审查”“被重命名”“被筛掉”。\r\n\r\n当当前文章和某张母版的动作类型高度匹配时，应当使用它作为质量锚点，抽取动作不变量，再为当前内容写出至少 3 个变异点。模板的价值是帮助判断“这种内容适合什么物理关系”，不是提供可描摹布局。\r\n\r\n真正要避免的是机械套模板：不看当前内容，直接照抄旧案例的物件组合、摆放关系、小黑动作和标签结构。每次都要让当前文章重新决定隐喻，至少重写标签语境，并根据内容调整动作、关系、角度或物件细节。\r\n\r\n彩蛋模式只有一个核心母版：`07-long-scroll-story-master.png`。它的价值不是具体物件，而是“真实物件人生线”的骨架：左起点、曲线路径、节点起伏、真实物件承载记忆点、小黑逐段参与、右侧收束。做新的长卷时，必须锁住这个骨架，再替换内容。\r\n\r\n完成标记：已说明使用哪张母版的空间关系，并明确哪些物件、动作、标签来自当前内容。\r\n\r\n### 5. QA 和迭代\r\n\r\n生成后按 `references/qa-checklist.md` 检查。重点看：\r\n\r\n- 候选图是否真的对齐了所选母版，而不只是包含相似元素。\r\n- 候选图是否过度复制了所选母版的空间拓扑、道具组合和小黑动作。\r\n- 候选图是否 3 秒读懂；如果需要解释主题才懂，就是失败。\r\n- 真实物件有没有截图感或贴图边界。\r\n- 场景有没有过大、过小、过满或过散。\r\n- 小黑是否承担核心动作。\r\n- 中文短标签是否准确、少、能读。\r\n- 有没有把模板母版机械套用，而不是根据当前内容重新适配。\r\n- 第一眼是否像“真实物件小现场”，而不是教程页、信息图或素材拼贴。\r\n- 彩蛋模式是否形成一条连续的真实物件人生线：左侧起点、曲线路径、节点起伏、小黑逐段参与、右侧收束。\r\n\r\n第一张生成图永远只是候选图，不是交付图。必须先查看候选图，并和所选母版做视觉比对。只要出现以下任何问题，就不交付，先重写提示词或重生成：\r\n\r\n- 元素清单化：把主题名词都堆进去，缺少一个清楚的物理冲突。\r\n- 母版复刻化：主体、方向、配件、小黑动作和标签位置像旧案例换字。\r\n- 读不懂：不看说明时，画面冲突不清楚。\r\n- 主物件过大或靠边，像商品图。\r\n- 物件太多，像素材拼贴。\r\n- 文字标签变成概念说明或标题。\r\n- 小黑没有承担母版级的物理动作。\r\n- 画面第一眼不像 `assets/examples/` 的正文配图质量。\r\n\r\n不合格就重生成或局部编辑，不要把低质量图展示为最终交付。可以向用户说明“候选图未过 QA，正在重做”，但不要把它包装成效果展示。\r\n\r\n完成标记：已通过 CRITICAL 项；未过 STANDARD 项时，交付状态标为 DONE_WITH_CONCERNS 并指出下一轮迭代方向。\r\n\r\n### 6. 保存交付\r\n\r\n如果用户在 workspace 内工作，把最终图复制到：\r\n\r\n```text\r\nassets/-xiaohei-scenes/\r\n```\r\n\r\n彩蛋长卷模式可以保存到：\r\n\r\n```text\r\nassets/-xiaohei-long-scroll/\r\n```\r\n\r\n按顺序命名：\r\n\r\n```text\r\n01-topic-name.png\r\n02-topic-name.png\r\n```\r\n\r\n保留原始生成文件，不覆盖已有资产，除非用户明确要求替换。\r\n\r\n完成标记：图片已展示或保存到目标目录，命名有序，未覆盖旧资产。\r\n\r\n## 输出口径\r\n\r\n生成前：短而准，给 shot list 或生成计划。\r\n\r\n生成后：展示图片、说明用途、给保存路径，并标出哪些最稳、哪些可选或需要再收一轮。\r\n\r\n不要长篇解释理论。让图先说话。\r\n\r\n## Completion States\r\n\r\n| 状态 | 含义 |\r\n| --- | --- |\r\n| DONE | 已完成 shot list 或图片生成，并按 QA 检查通过 |\r\n| DONE_WITH_CONCERNS | 已交付，但存在文字稳定性、物件真实感、背景纯度/近白空气感等待优化项 |\r\n| BLOCKED | 缺少主题/正文/节点，或用户要求的事实、人物、品牌信息不可确认 |\r\n\r\n## Quality Gates\r\n\r\n### Gate 1：CRITICAL（不过 = 不交付为最终图）\r\n\r\n- 标准模式必须有母版锁定记录；彩蛋模式必须锁定 07 长卷母版。\r\n- 标准模式必须有至少 3 个当前内容变异点，不能是旧母版换字版。\r\n- 小黑必须出现，并承担核心物理动作。\r\n- 真实物件必须像同一白色摄影棚里的真实小现场，不能是截图拼贴。\r\n- 标准模式必须是 16:9 正文图；彩蛋模式必须是超横版长卷图。\r\n- 标准模式背景必须接近 `#FFFFFF`；彩蛋模式背景必须是干净高级近白。\r\n- 中文标签必须短、少、可读，不能是假中文或大段解释。\r\n- 不得出现元素清单化：把主题里的多个名词、多个物件、多个标签都堆在一张图里。\r\n- 不得出现母版复刻化：把案例里的物件、方位、配件和小黑姿态原样换文字。\r\n- 画面必须 3 秒读懂；如果必须靠交付说明解释隐喻，不能交付为最终图。\r\n- 不得加入用户未提供或未授权的人名、联系方式、公司名、Logo、隐私信息。\r\n\r\n### Gate 2：STANDARD（不过 = 标注后可继续迭代）\r\n\r\n- 画面比例、留白、场景覆盖面积对齐母版。\r\n- 小黑形体稳定，不像表情包、吉祥物或儿童卡通。\r\n- 真实物件不压画面，节点之间有空气。\r\n- 彩色点缀只做节奏，不抢主体。\r\n- 输出能说明“哪张最稳、哪张需要再收一轮”。\r\n\r\n## Good vs Bad\r\n\r\n**好的：**\r\n\r\n> 一个真实主物件 + 一个小黑动作 + 2-4 个短标签。读者先看到真实小现场，再读懂处境。\r\n\r\n**差的：**\r\n\r\n> 把观点做成 PPT 流程图，堆很多箭头、模块框、大标题和解释文字，小黑只是站在旁边。\r\n\r\n**差在哪：**前者靠物理动作和真实物件讲故事；后者靠信息堆叠解释概念。\r\n\r\n## Suppressions\r\n\r\n- 用户明确提供的个人经历、品牌名、项目名，不算“未授权个人信息”，但不要额外发明。\r\n- 母版里的具体物件可以在内容匹配时复用，不算机械复刻；机械复刻指不看当前内容直接照搬旧图。\r\n- 生图模型偶发的轻微文字不稳不等于 Skill 失败，但必须在交付时标注并建议迭代。", "last_role": "assistant", "files": [], "msg_count": 4, "ideas": [], "workspace": "其他", "summary": "Base directory for this skill: C:\\Users\\godhu\\.workbuddy\\skills\\ian-xiaohei-scenes # Ian 小黑实物场景图 ## 核心定位 把文章观点、用户处境、个人经历、项目过程、产品演化和内容资产，转译成一", "status": "已完成", "ref_date": "2026-07-06", "ref_dt": "2026-07-06 21:26"}, {"id": "35944eea-736d-410a-bd66-758924afb841", "project": "g-workbuddy-2026-06-23-22-33-57", "cwd": "g:\\workbuddy\\2026-06-23-22-33-57", "title": "使用 ima-to-obsidian 技能，整理采集库（ID: 7475", "first_request": "使用 ima-to-obsidian 技能，整理采集库（ID: 7475195484854907）中的微信公众号文章。\n\n具体步骤：\n1. 调用 mcp__ima-mcp__get_knowledge_list（knowledge_base_id: \"7475195484854907\", filters: WECHAT_ARTICLE 类型，按更新时间降序），获取文章列表\n2. 读取 .workbuddy/memory/ima_processed.json 获取已处理记录，过滤出新文章。已处理过的自动跳过。\n3. 根据新文章数量选择策略：1-9篇一次性处理；10-29篇每批5篇；30+篇先列清单。\n4. 对每篇新文章：\n   a. 调用 mcp__ima-mcp__fetch_media_content 获取内容\n   b. 生成 frontmatter（YAML外层用单引号以防嵌套中文引号炸属性）\n   c. 图片：从  标签提取 URL，转为 ![](url) 嵌入正文\ 实物件选择、场景类型、原创隐喻和反复刻规则。\r\n- `references/master-selection.md`：标准模式 01-06 母版选择、质量锚点、变异要求和出图拦截规则。\r\n- `references/prompt-template.md`：单张生图提示词模板。\r\n- `references/qa-checklist.md`：生成后质量检查、失败信号和迭代方向。\r\n- `assets/examples/`：高质量模板母版和出图质量标尺。`01-06` 是标准 16:9 质量锚点；`07-long-scroll-story-master.png` 是彩蛋长卷模式唯一核心母版。标准图必须对齐它们的比例、留白、物件真实感、小黑气质、短标签密度、点缀色节奏和动作清晰度；不要复刻物件组合、空间拓扑、小黑姿态或标签位置。\r\n\r\n开始前确认：\r\n\r\n- 用户是否明确要标准 16:9 正文图，还是彩蛋长卷故事图。\r\n- 用户是否提供了必须保留的人名、品牌名、项目名或经历节点。\r\n- 如果没有明确要求生成图片，只先输出 shot list 或配图方案。\r\n- 如果用户要求“看效果 / 输出 / 生成”，标准模式必须先选择 01-06 中最匹配的母版；彩蛋模式必须锁定 07。没有母版锁定，不进入生图。\r\n- 如果对话上下文里没有刚刚看过对应母版，生成前必须查看所选母版图；生成后必须查看候选图再交付。\r\n\r\n## Core Flow\r\n\r\n### 1. 消化内容\r\n\r\n先提炼当前内容里的“处境”，不要急着找物件：\r\n\r\n- 这张图要让谁产生共鸣？\r\n- 他们正在被什么东西拉扯、筛选、压住、拽回、催促、重组？\r\n- 抽象概念能变成什么物理动作？\r\n- 哪 2-4 个短词能一秒戳中痛点？\r\n- 哪个真实物件天然承载这个处境？\r\n\r\n优先选择高共鸣节点：会议、消息、返工、审查、筛选、加码、被替代、下班失败、项目卡住、内容资产沉淀、产品演化断点。\r\n\r\n如果用户要求彩蛋模式，先把内容拆成 5-8 个连续节点：\r\n\r\n- 左侧起点：身份、起点、最初处境。\r\n- 中间节点：关键经历、项目转折、内容资产、产品演化。\r\n- 右侧终点：现在在做什么、核心关注、结论或下一阶段。\r\n- 每个节点都要有一个真实物件、小黑动作和 1-3 行短注释。\r\n\r\n完成标记：已经明确读者处境、核心冲突、真实物件、小黑动作和短中文标签；彩蛋模式已经得到 5-8 个可视化节点。\r\n\r\n### 1B. 事实锚定\r\n\r\n涉及个人经历、品牌名、公司名、项目名、粉丝数、时间跨度、成绩数字时，只能使用用户输入、用户提供素材或用户明确确认的事实。\r\n\r\n- 用户没有提供的事实，不要从母版继承，也不要补成看起来更完整的履历。\r\n- 无法确认的内容，用概括性标签替代，例如“内容平台”“项目节点”“用户反馈”“产品实验”。\r\n- 如果用户要求保留但信息不完整，在 shot list 或交付说明里标注“待确认”，不要把它画成确定事实。\r\n\r\n完成标记：所有具体事实都能回到用户输入或素材；不能回溯的事实已删除、抽象化或标注待确认。\r\n\r\n### 2. 先出 shot list\r\n\r\n如果用户说“分析 / 思考 / 怎么配图”，先给 shot list。每张写清：\r\n\r\n- 使用哪张母版\r\n- 图的主题\r\n- 读者共鸣点\r\n- 物理动作\r\n- 真实主物件\r\n- 小黑在做什么\r\n- 中文短标签\r\n- 为什么这张值得画\r\n\r\n标准模式默认 4-8 张。彩蛋模式默认先出 1 张长卷母版效果图。用户明确要“看效果 / 输出 / 生成”时，直接生图，不要停在方案，但仍必须先在内部完成 2B 母版锁定。\r\n\r\n完成标记：每个候选画面都有母版、主题、共鸣点、物理动作、真实主物件、小黑动作、短标签和成图理由。\r\n\r\n### 2B. 母版锁定（标准模式强制）\r\n\r\n标准模式每张图在生成前必须先完成母版锁定。读取 `references/master-selection.md`，从 `01-06` 里选一张最匹配的质量锚点。母版不是可复制构图；不要把案例的手机、纸条、沙漏、电脑、放大镜等空间拓扑直接搬过来。\r\n\r\n必填字段：\r\n\r\n```text\r\n母版：\r\n抽取的不变量：\r\n当前内容的变异点：\r\n画面 3 秒读懂句：\r\n当前内容适配：\r\n要避免的失败信号：\r\n```\r\n\r\n选择原则：\r\n\r\n- 下班失败、报警、返工回流、问题打结：优先 `03-production-alert`。\r\n- 消息涌出、任务过载：优先 `02-message-overload`。\r\n- 会议 / 同步 / 对齐把人拉回：优先 `01-meeting-pull-in`。\r\n- 审查 / 校对 / 兜底 / 返工检查：优先 `04-code-review-rework`。\r\n- AI 自动化、岗位重组、身份标签变化：优先 `05-ai-automation-badge`。\r\n- 筛选 / 过滤 / 关键词 / 机会流失：优先 `06-ai-resume-filter`。\r\n\r\n如果当前内容不完全匹配任何母版，也要选择最接近的一张作为比例、留白和信息密度标尺，然后重写物件、动作和标签。\r\n\r\n变异要求：\r\n\r\n- 至少 3 项和母版不同：主物件类别、空间方向、小黑动作、道具组合、标签位置、视角或叙事重心。\r\n- 如果主物件和母版相同，空间关系和小黑动作必须明显不同。\r\n- 如果空间关系和母版相近，主物件、动作和配件必须明显不同。\r\n- 不能把母版案例做成换字版。第一眼像旧案例换主题，即失败。\r\n\r\n硬性预算：\r\n\r\n- 只能有一个核心物理动作。\r\n- 只能有一个真实主物件或紧凑主物件组。\r\n- 最多 1-2 个小配件。\r\n- 最多 4 个短标签，优先 3 个。\r\n- 禁止把主题里的所有名词都画出来。出现“元素清单化”时，先删减再生成。\r\n- 单个深色大物件不能支配画面；手机、电脑、黑色盒子等深色主物件要缩小或换成更轻的实物锚点。\r\n- 整体场景要比母版更轻或同等轻，不能更满、更大、更重。\r\n\r\n完成标记：每张标准图都有明确母版、不变量、至少 3 个变异点、3 秒读懂句、适配点和失败信号；没有元素清单化或母版复刻化。\r\n\r\n### 3. 单张生成\r\n\r\n每张图单独生成，不要把多张拼成一张。\r\n\r\n默认用 16:9 横版。提示词必须包含：\r\n\r\n- 母版锁定：使用哪张 01-06 案例作为质量锚点，抽取哪些不变量，当前图如何做至少 3 个变异。\r\n- `#FFFFFF` 纯白背景和白色摄影棚表面，不能是灰白、暖白、米白、渐变或暗角。\r\n- 真实摄影物件自然融合，统一光影和透视。\r\n- 小黑参与核心物理动作。\r\n- 2-4 个短中文手写标签。\r\n- 少量蓝 / 粉 / 黄 / 绿 / 红点缀。\r\n- 中等场景覆盖面积，但视觉重量轻。\r\n- 禁止截图、UI、Logo、PPT、商业插画、贴图边界和大段解释。\r\n\r\n完成标记：每张标准图都有独立提示词，且包含比例、背景、真实物件、小黑动作、标签、点缀和负面约束。\r\n\r\n### 3B. 彩蛋长卷生成\r\n\r\n当用户说“彩蛋模式 / 长卷故事图 / 超横版 / 个人经历 / 项目复盘 / 产品演化 / 成长路径 / 像这张长图”时，使用彩蛋模式。\r\n\r\n彩蛋模式的母版是 `assets/examples/07-long-scroll-story-master.png`，核心是：\r\n\r\n- 超横版长卷，比例接近 `2.6:1` 到 `3:1`。\r\n- 高级近白背景，接近白色但保留极轻摄影棚空气感；不要死白导致物件漂浮。\r\n- 一条细黑色手绘弯曲路线贯穿全图。\r\n- 5-8 个真实物件节点，每个节点有小黑参与动作。\r\n- 节点沿路线形成自然、不规律的上下起伏，不能紧凑平铺成一条水平流程，也不能做成规律正弦波。\r\n- 节点之间要有明显留白且不等距，视觉重心左右平衡，不能让大物件集中或压住画面。\r\n- 路线节奏要像手画出来：平缓段、突然抬高、浅弯、较深下探和安静收尾可以混合出现；避免机械的高低交替。\r\n- 左侧是起点身份/开场，右侧是现在关注/结论。\r\n- 节点文字贴近物件，像直接写在空白里的手写人生注释，不是信息图模块。\r\n- 节点文案默认不要放在便利贴、纸条、卡片或标签框里；彩色胶带、小圆点和短下划线只做点缀。\r\n- 节点不用序号、编号圆点或步骤标记；靠路线、物件和短标签自然串联。\r\n- 彩色胶带、小圆点、短下划线只做节奏点缀。\r\n\r\n彩蛋模式要保留母版的空间结构和叙事方式，但根据当前内容替换节点主题、真实物件、小黑动作、节点文案、起点和终点表达。不要复刻 Ian 个人经历、Dribbble、Muzli、Twitter/X、IBC 等具体内容，除非用户明确就是要做 Ian 自我介绍。\r\n\r\n完成标记：长卷提示词包含超横版比例、高级近白背景、曲线路径、5-8 个真实物件节点、小黑逐段参与、左起右收、无序号节点和事实锚定后的节点文案。\r\n\r\n### 4. 使用模板母版\r\n\r\n`assets/examples/` 是高质量模板母版，不是死板模板，也不是物件排除规则。\r\n\r\n出图必须对齐这些优秀标准：\r\n\r\n- 场景覆盖面积。\r\n- 留白和空气感。\r\n- 真实物件光影。\r\n- 小黑和物件的比例关系。\r\n- 短标签数量。\r\n- 点缀色密度。\r\n- 动作类型，例如左右拉扯、中心审查、物件涌出、标签重命名、筛选过滤。\r\n- 叙事关系，例如“被拉进去”“挡不住”“被审查”“被重命名”“被筛掉”。\r\n\r\n当当前文章和某张母版的动作类型高度匹配时，应当使用它作为质量锚点，抽取动作不变量，再为当前内容写出至少 3 个变异点。模板的价值是帮助判断“这种内容适合什么物理关系”，不是提供可描摹布局。\r\n\r\n真正要避免的是机械套模板：不看当前内容，直接照抄旧案例的物件组合、摆放关系、小黑动作和标签结构。每次都要让当前文章重新决定隐喻，至少重写标签语境，并根据内容调整动作、关系、角度或物件细节。\r\n\r\n彩蛋模式只有一个核心母版：`07-long-scroll-story-master.png`。它的价值不是具体物件，而是“真实物件人生线”的骨架：左起点、曲线路径、节点起伏、真实物件承载记忆点、小黑逐段参与、右侧收束。做新的长卷时，必须锁住这个骨架，再替换内容。\r\n\r\n完成标记：已说明使用哪张母版的空间关系，并明确哪些物件、动作、标签来自当前内容。\r\n\r\n### 5. QA 和迭代\r\n\r\n生成后按 `references/qa-checklist.md` 检查。重点看：\r\n\r\n- 候选图是否真的对齐了所选母版，而不只是包含相似元素。\r\n- 候选图是否过度复制了所选母版的空间拓扑、道具组合和小黑动作。\r\n- 候选图是否 3 秒读懂；如果需要解释主题才懂，就是失败。\r\n- 真实物件有没有截图感或贴图边界。\r\n- 场景有没有过大、过小、过满或过散。\r\n- 小黑是否承担核心动作。\r\n- 中文短标签是否准确、少、能读。\r\n- 有没有把模板母版机械套用，而不是根据当前内容重新适配。\r\n- 第一眼是否像“真实物件小现场”，而不是教程页、信息图或素材拼贴。\r\n- 彩蛋模式是否形成一条连续的真实物件人生线：左侧起点、曲线路径、节点起伏、小黑逐段参与、右侧收束。\r\n\r\n第一张生成图永远只是候选图，不是交付图。必须先查看候选图，并和所选母版做视觉比对。只要出现以下任何问题，就不交付，先重写提示词或重生成：\r\n\r\n- 元素清单化：把主题名词都堆进去，缺少一个清楚的物理冲突。\r\n- 母版复刻化：主体、方向、配件、小黑动作和标签位置像旧案例换字。\r\n- 读不懂：不看说明时，画面冲突不清楚。\r\n- 主物件过大或靠边，像商品图。\r\n- 物件太多，像素材拼贴。\r\n- 文字标签变成概念说明或标题。\r\n- 小黑没有承担母版级的物理动作。\r\n- 画面第一眼不像 `assets/examples/` 的正文配图质量。\r\n\r\n不合格就重生成或局部编辑，不要把低质量图展示为最终交付。可以向用户说明“候选图未过 QA，正在重做”，但不要把它包装成效果展示。\r\n\r\n完成标记：已通过 CRITICAL 项；未过 STANDARD 项时，交付状态标为 DONE_WITH_CONCERNS 并指出下一轮迭代方向。\r\n\r\n### 6. 保存交付\r\n\r\n如果用户在 workspace 内工作，把最终图复制到：\r\n\r\n```text\r\nassets/-xiaohei-scenes/\r\n```\r\n\r\n彩蛋长卷模式可以保存到：\r\n\r\n```text\r\nassets/-xiaohei-long-scroll/\r\n```\r\n\r\n按顺序命名：\r\n\r\n```text\r\n01-topic-name.png\r\n02-topic-name.png\r\n```\r\n\r\n保留原始生成文件，不覆盖已有资产，除非用户明确要求替换。\r\n\r\n完成标记：图片已展示或保存到目标目录，命名有序，未覆盖旧资产。\r\n\r\n## 输出口径\r\n\r\n生成前：短而准，给 shot list 或生成计划。\r\n\r\n生成后：展示图片、说明用途、给保存路径，并标出哪些最稳、哪些可选或需要再收一轮。\r\n\r\n不要长篇解释理论。让图先说话。\r\n\r\n## Completion States\r\n\r\n| 状态 | 含义 |\r\n| --- | --- |\r\n| DONE | 已完成 shot list 或图片生成，并按 QA 检查通过 |\r\n| DONE_WITH_CONCERNS | 已交付，但存在文字稳定性、物件真实感、背景纯度/近白空气感等待优化项 |\r\n| BLOCKED | 缺少主题/正文/节点，或用户要求的事实、人物、品牌信息不可确认 |\r\n\r\n## Quality Gates\r\n\r\n### Gate 1：CRITICAL（不过 = 不交付为最终图）\r\n\r\n- 标准模式必须有母版锁定记录；彩蛋模式必须锁定 07 长卷母版。\r\n- 标准模式必须有至少 3 个当前内容变异点，不能是旧母版换字版。\r\n- 小黑必须出现，并承担核心物理动作。\r\n- 真实物件必须像同一白色摄影棚里的真实小现场，不能是截图拼贴。\r\n- 标准模式必须是 16:9 正文图；彩蛋模式必须是超横版长卷图。\r\n- 标准模式背景必须接近 `#FFFFFF`；彩蛋模式背景必须是干净高级近白。\r\n- 中文标签必须短、少、可读，不能是假中文或大段解释。\r\n- 不得出现元素清单化：把主题里的多个名词、多个物件、多个标签都堆在一张图里。\r\n- 不得出现母版复刻化：把案例里的物件、方位、配件和小黑姿态原样换文字。\r\n- 画面必须 3 秒读懂；如果必须靠交付说明解释隐喻，不能交付为最终图。\r\n- 不得加入用户未提供或未授权的人名、联系方式、公司名、Logo、隐私信息。\r\n\r\n### Gate 2：STANDARD（不过 = 标注后可继续迭代）\r\n\r\n- 画面比例、留白、场景覆盖面积对齐母版。\r\n- 小黑形体稳定，不像表情包、吉祥物或儿童卡通。\r\n- 真实物件不压画面，节点之间有空气。\r\n- 彩色点缀只做节奏，不抢主体。\r\n- 输出能说明“哪张最稳、哪张需要再收一轮”。\r\n\r\n## Good vs Bad\r\n\r\n**好的：**\r\n\r\n> 一个真实主物件 + 一个小黑动作 + 2-4 个短标签。读者先看到真实小现场，再读懂处境。\r\n\r\n**差的：**\r\n\r\n> 把观点做成 PPT 流程图，堆很多箭头、模块框、大标题和解释文字，小黑只是站在旁边。\r\n\r\n**差在哪：**前者靠物理动作和真实物件讲故事；后者靠信息堆叠解释概念。\r\n\r\n## Suppressions\r\n\r\n- 用户明确提供的个人经历、品牌名、项目名，不算“未授权个人信息”，但不要额外发明。\r\n- 母版里的具体物件可以在内容匹配时复用，不算机械复刻；机械复刻指不看当前内容直接照搬旧图。\r\n- 生图模型偶发的轻微文字不稳不等于 Skill 失败，但必须在交付时标注并建议迭代。", "last_role": "assistant", "files": [], "msg_count": 2, "ideas": [], "workspace": "其他", "summary": "Base directory for this skill: C:\\Users\\godhu\\.workbuddy\\skills\\ian-xiaohei-scenes # Ian 小黑实物场景图 ## 核心定位 把文章观点、用户处境、个人经历、项目过程、产品演化和内容资产，转译成一", "status": "已完成", "ref_date": "2026-07-06", "ref_dt": "2026-07-06 18:05"}, {"id": "5484fa55-d88b-4ebe-8e3e-4b569f166d47", "project": "g-workbuddy-2026-06-19-02-37-22", "cwd": "g:\\workbuddy\\2026-06-19-02-37-22", "title": "https://github.com/helloianneo/ian-x", "first_request": "https://github.com/helloianneo/ian-xiaohei-scenes 安装这个技能</user_query>", "last_role": "assistant", "files": [{"path": "G:\\workbuddy\\2026-06-19-02-37-22\\output\\Generate_one_standalone_16_9_h_2026-07-06T10-06-54.png", "note": "用 ian-xiaohei-scenes 技能生成的「消息过载」主题小黑 function wsColor(name){
  let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0;
  return WS_COLORS[h%WS_COLORS.length];
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fileUrl(p){return "file:///"+p.replace(/\\/g,"/");}

let state={mode:"overview",value:"",q:""};

function wsList(){
  const m={}; D.forEach(s=>{m[s.workspace]=(m[s.workspace]||0)+1;});
  const arr=Object.entries(m).sort((a,b)=> b[1]-a[1]);
  const other=arr.find(x=>x[0]==="其他"); const main=arr.filter(x=>x[0]!=="其他");
  return main.concat(other? [other]:[]);
}
function catList(){
  const m={}; D.forEach(s=>s.files.forEach(f=>{m[f.category]=(m[f.category]||0)+1;}));
  const order=["爆款素材","搜索文章"];
  return order.filter(k=>m[k]);
}
function filtered(){
  let list=D;
  if(state.mode==="workspace") list=list.filter(s=>s.workspace===state.value);
  if(state.mode==="category") list=list; // 内容库单独处理
  if(state.q){
    const q=state.q.toLowerCase();
    list=list.filter(s=>{
      if((s.title+"").toLowerCase().includes(q)) return true;
      if((s.summary+"").toLowerCase().includes(q)) return true;
      return s.files.some(f=>(f.name+"").toLowerCase().includes(q)||(f.path+"").toLowerCase().includes(q));
    });
  }
  return list;
}
function statsOf(list){
  const days=new Set(list.map(s=>s.ref_date)).size;
  const files=list.reduce((a,s)=>a+s.files.length,0);
  const doing=list.filter(s=>s.status==="进行中").length;
  return {sessions:list.length,files,days,doing};
}
function renderNav(){
  const ws=wsList(), cat=catList();
  const wsHtml=ws.map(([n,c])=>navItem("workspace",n,`<span class="ws-badge" style="background:${wsColor(n)}">${esc(n[0])}</span><span>${esc(n)}</span>`,c)).join("");
  document.getElementById("wsNav").innerHTML=wsHtml;
  document.getElementById("wsNavM").innerHTML=wsHtml;

  document.getElementById("catNav").innerHTML=catHtml;
  document.getElementById("catNavM").innerHTML=catHtml;
  // 手机顶栏
  const mtop=[`<div class="mbtn ${state.mode==='overview'?'active':''}" onclick="go('overview','')">概览</div>`];
  mtop.push(`<div class="mbtn ${state.mode==='workspace'?'active':''}" onclick="openDrawer()">空间</div>`);

  document.getElementById("mtop").innerHTML=mtop.join("");

  if(ic) ic.textContent=IDEAS.length;
}
function navItem(mode,value,label,cnt){
  const active=(state.mode===mode&&state.value===value)?" active":"";
  return `<div class="nav-item${active}" data-mode="${mode}" data-value="${esc(value)}" onclick="go('${mode}','${esc(value)}')">${label}<span class="cnt">${cnt}</span></div>`;
}
function catCount(name){let c=0;D.forEach(s=>s.files.forEach(f=>{if(f.category===name)c++;}));return c;}

function fileChip(f){
  const col=CAT_COLOR[f.category]||"#ccc";
  return `<a class="file" href="${esc(fileUrl(f.path))}" target="_blank" title="${esc(f.path)}">
    <span class="dot" style="background:${col}"></span>
    <span class="fname">${esc(f.name)}</span>
    <span class="fcat">${esc(f.category)}</span>
    <span class="fkind">${esc(f.kind)}</span></a>`;
}
function sessionCard(s){
  const fc=s.files.length;
  const fcollapsed = fc>3 ? "collapsed":"";
  const fchev = fc>3 ? "▸":"▾";
  return `<div class="card">
    <div class="row1">
      <span class="ws" style="background:${wsColor(s.workspace)}">${esc(s.workspace[0])}</span>
      <span class="title">${esc(s.title)}</span>
      <span class="pill ${s.status==='进行中'?'doing':'done'}">${esc(s.status)}</span>
    </div>
    ${s.summary?`<div class="sum">${esc(s.summary)}</div>`:""}
    <div class="ftime">${esc(s.ref_dt)} · ${esc(s.workspace)} · ${fc} 个文件</div>
    ${fc?`<div class="file-toggle" onclick="toggleFiles('${esc(s.id)}')">
        <span>文件（${fc}）</span><span class="chev" id="chev-files-${esc(s.id)}">${fchev}</span>
      </div>
      <div class="files ${fcollapsed}" id="files-${esc(s.id)}">${s.files.map(fileChip).join("")}</div>`:""}
  </div>`;
}
function timelineView(list){
  const byDay={};
  list.forEach(s=>{(byDay[s.ref_date]=byDay[s.ref_date]||[]).push(s);});
  const days=Object.keys(byDay).sort().reverse();
  if(!days.length) return `<div class="empty">没有匹配的内容</div>`;
  return days.map(d=>{
    const arr=byDay[d].slice().sort((a,b)=>b.ref_dt.localeCompare(a.ref_dt));
    return `<div class="day" id="day-${esc(d)}"><div class="day-head" onclick="toggleDay('${esc(d)}')">
        <span class="chev" id="chev-day-${esc(d)}">▾</span>
        <span class="date">${esc(d)}</span><span class="wcount">${arr.length} 个会话</span></div>
      <div class="cards">${arr.map(sessionCard).join("")}</div></div>`;
  }).join("");
}
function ideaCard(i){

  const byDay={};

  if(!days.length) return `<div class="empty">没有匹配的灵感</div>`;
  return days.map(d=>{
    const arr=byDay[d];
    return `<div class="day" id="day-${esc(d)}"><div class="day-head" onclick="toggleDay('${esc(d)}')">

      <div class="cards">${arr.map(ideaCard).join("")}</div></div>`;
  }).join("");
}
function libraryView(catName){
  const items=[];
  D.forEach(s=>s.files.forEach(f=>{

  }));
  items.sort((a,b)=>b.s.ref_dt.localeCompare(a.s.ref_dt));

    <div class="lib-grid">${items.map(({f,s})=>`<div class="lib-card">

    </div>`).join("")}</div>`;
}

    const title = state.mode==="workspace"? state.value : "近期概览";
    document.getElementById("viewTitle").textContent=title;
    document.getElementById("viewMeta").textContent=
      `会话 ${st.sessions} · 文件 ${st.files} · 活跃 ${st.days} 天 · 进行中 ${st.doing}` + (state.q?` · 搜索“${state.q}”`:"");
    document.getElementById("content").innerHTML=timelineView(list);
  }
  // 同步侧栏高亮
  document.querySelectorAll(".sidebar .nav-item").forEach(el=>{
    const m=el.getAttribute("data-mode"),v=el.getAttribute("data-value")||"";
    el.classList.toggle("active", m===state.mode && v===state.value);
  });
}
function go(mode,value){
  state.mode=mode; state.value=value;
  closeDrawer();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function toggleDay(d){
  const el=document.getElementById("day-"+d);
  if(!el) return;
  el.classList.toggle("collapsed");
  const c=document.getElementById("chev-day-"+d);
  if(c) c.textContent = el.classList.contains("collapsed") ? "▸":"▾";
}
function toggleFiles(id){
  const el=document.getElementById("files-"+id);
  if(!el) return;
  el.classList.toggle("collapsed");
  const c=document.getElementById("chev-files-"+id);
  if(c) c.textContent = el.classList.contains("collapsed") ? "▸":"▾";
}
function collapseAll(){
  document.querySelectorAll(".day").forEach(el=>{
    el.classList.add("collapsed");
    const d=el.id.replace("day-","");
    const c=document.getElementById("chev-day-"+d);
    if(c) c.textContent="▸";
  });
}
function expandAll(){
  document.querySelectorAll(".day").forEach(el=>{
    el.classList.remove("collapsed");
    const d=el.id.replace("day-","");
    const c=document.getElementById("chev-day-"+d);
    if(c) c.textContent="▾";
  });
}
function onSearch(v){state.q=v;render();}
function copyPath(p){
  if(navigator.clipboard){navigator.clipboard.writeText(p).then(()=>alert("已复制路径：\n"+p));}
  else{alert("路径：\n"+p);}
}
function openDrawer(){document.getElementById("drawer").classList.add("show");document.getElementById("mask").classList.add("show");}
function closeDrawer(){document.getElementById("drawer").classList.remove("show");document.getElementById("mask").classList.remove("show");}
document.getElementById("mask").addEventListener("click",closeDrawer);
render();
</script>
</body>
</html>
